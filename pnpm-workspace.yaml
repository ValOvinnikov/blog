packages:
  - 'apps/*'
  - 'configs/*'
  - 'packages/*'

catalog:
  eslint: ^10.11.0
  prettier: ^3.9.5
  react: ^19.0.0
  react-dom: ^19.0.0
  storybook: ^10.6.1
  typescript: ^6.0.3
  vite-plugin-svgr: ^5.2.0
  vitest: ^5.0.3
  zod: ^4.6.2

overrides:
  js-yaml@<3.15.0: '>=3.15.0'
  postcss: '>=8.5.23'
  prismjs@<1.30.0: '>=1.30.0'
  smol-toml@<1.6.1: '>=1.6.1'
  uuid@<11.1.1: '>=11.1.1'
  undici: '>=6.28.0'
  fast-uri: '>=3.1.5'
  '@codemirror/state': '6.7.6'
  '@codemirror/view': '6.43.13'

ignoredOptionalDependencies:
  - nodemailer

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
