packages:
  - 'apps/*'
  - 'configs/*'
  - 'packages/*'

catalog:
  '@faker-js/faker': ^10.6.0
  eslint: ^10.15.0
  prettier: ^3.10.1
  react: ^19.3.1
  react-dom: ^19.3.1
  storybook: ^10.6.8
  typescript: ^6.0.3
  vite-plugin-svgr: ^5.2.0
  vitest: ^5.1.1
  zod: ^4.6.7

overrides:
  js-yaml@<3.15.0: '>=3.15.0'
  postcss: '>=8.5.23'
  prismjs@<1.30.0: '>=1.30.0'
  smol-toml@<1.6.1: '>=1.6.1'
  uuid@<11.1.1: '>=11.1.1'
  nanoid@>=5.0.0 <5.1.16: ^5.1.16
  undici@<6.28.0: ^6.28.0
  fast-uri: '>=3.1.5'
  '@codemirror/state': '6.7.6'
  '@codemirror/view': '6.43.13'

ignoredOptionalDependencies:
  - nodemailer

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  cbor-extract: false
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@workflow/astro@5.0.15'
  - '@workflow/builders@5.1.6'
  - '@workflow/cli@5.3.3'
  - '@workflow/core@5.8.0'
  - '@workflow/errors@5.2.0'
  - '@workflow/nest@5.1.13'
  - '@workflow/next@5.1.6'
  - '@workflow/nitro@5.0.15'
  - '@workflow/nuxt@5.0.15'
  - '@workflow/rollup@5.0.15'
  - '@workflow/sveltekit@5.0.15'
  - '@workflow/vite@5.0.15'
  - '@workflow/web@5.3.3'
  - '@workflow/world-local@5.6.0'
  - '@workflow/world-vercel@5.8.0'
  - '@workflow/world@5.4.0'
  - workflow@5.8.0
