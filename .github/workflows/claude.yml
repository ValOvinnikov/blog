name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

env:
  PNPM_VERSION: 11.21.0
  NODE_VERSION: '24'

jobs:
  claude:
    # Restrict to the repo owner only — this repo is public, and without an
    # actor check any commenter could trigger a real agent run against
    # github.actor's credentials/quota.
    #
    # The actor check alone only gates *who triggers* a run, not *whose
    # content the agent reads as context*. Since this job has contents:write +
    # pull-requests:write, an untrusted user could plant an adversarial
    # issue/PR body that the agent later ingests when the owner @claude's that
    # thread. Each branch below additionally requires the underlying
    # issue/PR to be owner-authored (github.event.issue.user.login /
    # github.event.pull_request.user.login), closing that vector.
    if: |
      github.actor == 'ValOvinnikov' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.issue.user.login == 'ValOvinnikov') ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.pull_request.user.login == 'ValOvinnikov') ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.pull_request.user.login == 'ValOvinnikov') ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && github.event.issue.user.login == 'ValOvinnikov')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # lets Claude push branches so it can open PRs
      pull-requests: write # lets Claude open/update PRs
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Safe even though this job pushes branches: claude-code-action
          # configures its own git auth (embeds a fresh token in the remote
          # URL / a credential helper) and explicitly strips the credential
          # actions/checkout would otherwise persist. See
          # https://github.com/anthropics/claude-code-action/blob/main/src/github/operations/git-config.ts
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@833fb0f8c9f6686b33d963a8bae0a94f4936ab2a # v1.0.211
        # `.mcp.json` authenticates the github MCP server with
        # `Bearer ${GITHUB_PAT}`. Secrets are never auto-exposed as env vars, so
        # without this the header expands to a bare "Bearer " and the server
        # rejects the connection with a 400, leaving every mcp__github__* tool
        # unavailable in cloud runs. The secret is named GH_PAT because GitHub
        # refuses to create any Actions secret whose name starts with GITHUB_.
        env:
          GITHUB_PAT: ${{ secrets.GH_PAT }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Reuse the repo's own tool allowlist (pnpm scripts, git read/commit,
          # etc.) so cloud runs don't need per-command approval for things
          # already vetted for local sessions.
          settings: .claude/settings.json

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Trigger-phrase model routing: "@claude-opus" runs Opus 4.8;
          # plain "@claude" (the default) runs Sonnet 5. "@claude-opus"
          # already contains the "@claude" substring, so the job's `if:`
          # trigger above fires for both without any change.
          #
          # git push / gh pr create are allowed here (cloud-only), not in the
          # shared .claude/settings.json — that file also governs interactive
          # local sessions, which should keep asking before every push/PR.
          #
          # --append-system-prompt COMBINES with the SDK's default system prompt (the
          # claude_code preset) rather than replacing it — see the action's
          # parseSdkOptions. The `prompt:` input above is a different mechanism: it
          # replaces the dynamically-derived task content tag mode builds from the
          # triggering comment with a static template (the risk the comment above
          # already names), not something that touches this job's own `if:` gate,
          # which is independent and unaffected either way. Without this
          # append-system-prompt line, a run's default is to push a branch and leave
          # a "Create PR" link in its comment rather than opening the PR itself,
          # requiring a human click every time (confirmed empirically: runs on #2571
          # with an explicit per-ticket instruction opened their own PR; runs on
          # #2579/#2582 without one did not).
          claude_args: |
            --model ${{ (contains(github.event.comment.body, '@claude-opus') || contains(github.event.review.body, '@claude-opus') || contains(github.event.issue.body, '@claude-opus') || contains(github.event.issue.title, '@claude-opus')) && 'claude-opus-4-8' || 'claude-sonnet-5' }}
            --allowedTools "Bash(git push:*),Bash(gh pr create:*),Bash(gh pr edit:*)"
            --append-system-prompt "When your implementation is ready, commit, push your branch, and open the pull request yourself via gh pr create in this same run instead of leaving only a Create PR link for a human to click — this runner is ephemeral, so unpushed or un-opened work is lost once the job ends. Only the completing PR in a multi-PR sequence should carry a Closes #<n> keyword. Before starting: if you were tagged on an issue that already has an open PR referencing it, continue on that PR's existing branch — the one matching the layer you're already working in, if more than one is open — rather than opening a new, disconnected one."

