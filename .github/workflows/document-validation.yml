name: Document Validation

# Checks every existing document in the console project's live dataset
# against the current Studio schema. Content drifts out of validity without a
# commit, so this runs on demand and before a release rather than on a
# schedule or per PR. Tenant datasets are covered by
# validate-tenant-documents.yml, which this workflow never touches.
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SANITY_API_READ_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: document-validation
  cancel-in-progress: false

env:
  PNPM_VERSION: 11.21.0
  NODE_VERSION: '24'
  SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
  SANITY_STUDIO_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}

jobs:
  document-validation:
    name: Document validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SANITY_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
    steps:
      - name: Require SANITY_API_READ_TOKEN
        if: ${{ env.SANITY_READ_TOKEN == '' }}
        run: |
          echo "::error title=Missing secret::SANITY_API_READ_TOKEN is not set, so no documents were validated. Add the repository secret, or pass it from the calling workflow."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # `--yes` skips the confirmation prompt, which CI has no TTY for.
      - name: Validate documents against schema (read-only)
        working-directory: packages/studio
        env:
          SANITY_AUTH_TOKEN: ${{ env.SANITY_READ_TOKEN }}
        run: pnpm exec sanity documents validate --yes

  report-failure:
    name: Report failure
    needs: document-validation
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: 'Document validation is failing'
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
      HAS_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN != '' }}
    steps:
      - name: Open or comment on the tracking issue
        run: |
          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | first | .number // empty")
          if [ "$HAS_READ_TOKEN" = "true" ]; then
            body="Document validation failed on the \`$DATASET\` dataset: $RUN_URL

          Read the failing step's output for the document IDs and field paths, then fix those documents in Studio."
          else
            body="Document validation could not run on the \`$DATASET\` dataset: $RUN_URL

          The \`SANITY_API_READ_TOKEN\` secret is not set, so no documents were checked. Add the repository secret, or pass it from the calling workflow, then re-run."
          fi
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            # A missing label fails the whole create, so the report is retried unlabelled.
            gh issue create --title "$TITLE" --label bug --label prio:next --body "$body" \
              || gh issue create --title "$TITLE" --body "$body"
          fi
