name: CI

on:
  # Neither a `paths-ignore` nor a `branches:` filter here, on purpose.
  # Build/Lint/Test/Type-check/Typegen are *required* status checks in the
  # branch ruleset, and a required check that never starts sits "Pending"
  # forever rather than failing — so anything that skips this workflow blocks
  # the PR permanently instead of reporting on it.
  #
  # A path filter would do that to a PR touching only the ignored paths (e.g.
  # a `.claude/**` or docs-only PR). A base-branch filter would do it to a PR
  # based on anything but `main` — the normal shape of a stacked PR — and
  # retargeting when the base merges does not rescue it, because that fires
  # `edited` while this listens for `opened`/`synchronize`/`reopened`.
  #
  # Running CI on every PR is cheap and avoids both deadlocks. The other five
  # workflows carrying required checks (knip, dependency-review, zizmor,
  # actionlint, hooks) declare their triggers independently and must stay
  # unfiltered for the same reason.
  pull_request:

permissions:
  contents: read

# A force-push/synchronize supersedes the running suite for the same ref —
# cancel it instead of paying for two full parallel runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.21.0
  NODE_VERSION: '24'
  # The Sanity project/dataset are not hardcoded in the repo — the Studio/CLI
  # config reads them from SANITY_STUDIO_*. Jobs that load that config (typegen,
  # build, migrations) need them present, so source them from repo-level
  # Variables (Settings → Secrets and variables → Actions → Variables):
  #   SANITY_STUDIO_PROJECT_ID, SANITY_STUDIO_DATASET.
  # The migrations dry-run connects to the real dataset, so these must be the
  # production values (project id is public, so a Variable — not a Secret — is fine).
  SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
  SANITY_STUDIO_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
  # Vercel Remote Cache for turbo tasks — shares artifacts across PR CI, the
  # deploy verify jobs, and local dev. No-op until TURBO_TOKEN (repo Secret) and
  # TURBO_TEAM (repo Variable) exist; turbo then falls back to the local cache.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  type-check:
    name: Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Type-check
        run: pnpm type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Test
        run: pnpm test

  typegen:
    name: Typegen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # Drift guard: regenerate schema.json + types.ts from the current
      # schemas and require the committed output to match — a schema change
      # merged without `pnpm typegen` ships stale (but self-consistent) types
      # that type-check alone can't catch. Typegen is non-deterministic (see
      # CLAUDE.md), so a mismatch gets up to 3 regeneration attempts before it
      # counts as drift. Read-only: nothing is committed from CI.
      - name: Typegen (verify committed output is current)
        run: |
          set -euo pipefail
          generated=packages/config/src/sanity/generated
          for attempt in 1 2 3; do
            (cd packages/studio && pnpm typegen)
            if [ -z "$(git status --porcelain -- "$generated")" ]; then
              echo "Committed typegen output is current (attempt ${attempt})."
              exit 0
            fi
            echo "Attempt ${attempt}: regenerated output differs from committed output."
          done
          echo '::group::typegen drift (regenerated vs committed)'
          git status --porcelain -- "$generated"
          git --no-pager diff --color=never -- "$generated"
          echo '::endgroup::'
          echo "::error::Committed generated types in ${generated} are stale. Run 'pnpm typegen' locally and commit the regenerated files."
          exit 1

  ui-index:
    name: UI index
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # `--verify` runs three read-only guards over packages/ui/COMPONENTS.md
      # (regenerated from the ui sources by scripts/gen-ui-index.mjs) in one
      # parse: drift (committed index stale vs. the sources), structure (a
      # component folder that produced no entry or a compound slot that didn't
      # resolve — a silently-unindexed component), and descriptions (an exported
      # component/slot with no JSDoc description). The pre-commit hook runs the
      # same structure+description guards locally; this is the CI backstop.
      # Nothing is committed.
      - name: UI index (verify current, complete + documented)
        run: pnpm gen:ui-index:check

      # Fixture-based unit tests for the generator's props-resolution helpers
      # (#1763). The drift guard above only catches a regression while the real
      # component tree still happens to contain a component of each shape;
      # these pin the behaviour against inline sources instead. They live in
      # this job rather than hooks.yml because they import the repo's
      # typescript, which only the pnpm-install jobs have.
      - name: UI index (helper unit tests)
        run: pnpm gen:ui-index:test

  voice-key-sync:
    name: Voice key sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # The "voice" override vocabulary is hand-duplicated across the studio
      # schema, the platform editor's field groups, and web's message-merge
      # paths, with nothing else catching one drifting out of sync with the
      # other two. Parses all three as a TypeScript AST and compares the
      # extracted key sets. Read-only; nothing is committed.
      - name: Voice-override keys (studio/platform/web in sync)
        run: pnpm check:voice-sync

      # Fixture-based unit tests for the extraction + comparison helpers, same
      # rationale as the UI index job's helper tests above — they need the
      # repo's typescript package, which only the pnpm-install jobs have.
      - name: Voice key sync (helper unit tests)
        run: pnpm check:voice-sync:test

  turbo-env-sync:
    name: Turbo env sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # Turbo strict env mode strips any var not in the "build" task's "env"
      # allowlist before running the build, so a var declared in an app's or
      # a dependency package's env.ts but missing from turbo.json silently
      # disappears at build time. Parses every relevant env.ts as a
      # TypeScript AST and compares the declared keys against the allowlist.
      # Read-only; nothing is committed.
      - name: Turbo build env allowlist (web/platform in sync)
        run: pnpm check:turbo-env-sync

      # Fixture-based unit tests for the extraction + comparison helpers, same
      # rationale as the UI index/voice key sync jobs above — they need the
      # repo's typescript package, which only the pnpm-install jobs have.
      - name: Turbo env sync (helper unit tests)
        run: pnpm check:turbo-env-sync:test

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read-only guard against broken content migrations. Content is live in
    # the `production` dataset, so a malformed or un-runnable migration must
    # not slip through. `sanity migrations list` loads + registers every
    # migration (fails on import errors / bad defineMigration). When a
    # read-only Sanity token is configured (repo/org secret
    # `SANITY_API_READ_TOKEN`), it additionally dry-runs each migration
    # against the dataset — this never mutates data (`sanity migrations run`
    # defaults to dry mode; `--no-dry-run` is never used here). Actually
    # applying a migration to production stays human-gated. Document-schema
    # validation against the live dataset lives in the separate
    # `document-validation` job below (advisory, not part of this required
    # check) — see that job's comment for why.
    env:
      SANITY_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate migrations load
        working-directory: packages/studio
        run: pnpm exec sanity migrations list

      - name: Dry-run migrations (read-only; requires SANITY_API_READ_TOKEN)
        if: ${{ env.SANITY_READ_TOKEN != '' }}
        working-directory: packages/studio
        env:
          # The Sanity CLI authenticates non-interactively from SANITY_AUTH_TOKEN.
          SANITY_AUTH_TOKEN: ${{ env.SANITY_READ_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in migrations/*/; do
            # Only dirs holding a migration — skips backups/ and any non-migration
            # folder, and is a no-op when there are zero migrations.
            [ -f "${dir}index.ts" ] || continue
            id="$(basename "${dir}")"
            echo "::group::dry-run ${id}"
            # Dry mode is the default — computes the diff, never writes.
            pnpm exec sanity migrations run "${id}"
            echo "::endgroup::"
          done

  document-validation:
    name: Document validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ADVISORY — deliberately NOT a required status check in the branch
    # ruleset, unlike the Migrations job above. `sanity documents validate`
    # checks every existing document in the live dataset against the current
    # Studio schema. A routine schema evolution can drift existing content
    # out of validity independent of what any given PR touches, so a hard
    # failure here would block every future PR the moment one existing
    # document drifts — the same "doesn't gate on the PR's own diff" reason
    # Lighthouse CI / Playwright smoke stay advisory in this workflow file.
    env:
      SANITY_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # Read-only: `sanity documents validate` downloads every document in the
      # configured dataset and checks it against the Studio schema — it never
      # writes. Same guard + token as the Migrations job's dry-run step (a
      # read scope is sufficient for validation, so no separate secret is
      # needed). `--yes` skips the interactive confirmation prompt, which CI
      # has no TTY for.
      - name: Validate documents against schema (read-only; requires SANITY_API_READ_TOKEN)
        if: ${{ env.SANITY_READ_TOKEN != '' }}
        working-directory: packages/studio
        env:
          SANITY_AUTH_TOKEN: ${{ env.SANITY_READ_TOKEN }}
        run: pnpm exec sanity documents validate --yes

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [type-check, lint, test, typegen]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Build
        run: pnpm build
        # @blog/service validates its env at import time (Zod via
        # @t3-oss/env-core). CI has no Sanity env vars, so skip validation
        # here — the build doesn't fetch, and real validation still runs at
        # deploy time on Vercel where the vars are set. Pages tolerate a
        # missing client (service fetchers return an `ok: false` Result).
        env:
          SKIP_ENV_VALIDATION: 'true'
