name: CI

on:
  # Neither a `paths-ignore` nor a `branches:` filter here, on purpose. `CI` is
  # a required status check, and a required check that never starts sits
  # "Pending" forever rather than failing — so anything that skips this
  # workflow blocks the PR permanently instead of reporting on it.
  #
  # A path filter would do that to a PR touching only the ignored paths (e.g.
  # a `.claude/**` or docs-only PR). A base-branch filter would do it to a PR
  # based on anything but `main` — the normal shape of a stacked PR — and
  # retargeting when the base merges does not rescue it, because that fires
  # `edited`, which this does not listen for.
  #
  # The other workflow carrying a required check, workflow-security.yml,
  # declares its trigger independently and must stay unfiltered for the same
  # reason.
  pull_request:
    # Every job but `CI` skips on a draft, so `ready_for_review` is what runs
    # the full gate once a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A force-push/synchronize supersedes the running suite for the same ref —
# cancel it instead of paying for two full parallel runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.21.0
  NODE_VERSION: '24'
  # The Sanity project/dataset are not hardcoded in the repo — the Studio/CLI
  # config reads them from SANITY_STUDIO_*. Jobs that load that config (typegen,
  # build, migrations) need them present, so source them from repo-level
  # Variables (Settings → Secrets and variables → Actions → Variables):
  #   SANITY_STUDIO_PROJECT_ID, SANITY_STUDIO_DATASET.
  # The migrations dry-run connects to the real dataset, so these must be the
  # production values (project id is public, so a Variable — not a Secret — is fine).
  SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
  SANITY_STUDIO_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
  # Vercel Remote Cache for turbo tasks — shares artifacts across PR CI, the
  # deploy verify jobs, and local dev. No-op until TURBO_TOKEN (repo Secret) and
  # TURBO_TEAM (repo Variable) exist; turbo then falls back to the local cache.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  changes:
    name: Changes
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.filter.outputs.full }}
      studio: ${{ steps.filter.outputs.studio }}
      env-presence: ${{ steps.filter.outputs.env-presence }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # `studio` is @blog/studio's turbo-affected set (itself, its workspace
      # dependencies config and utils, and the lockfile) written out as paths,
      # so this job needs no install. It is wider than `packages/studio/**`
      # because schemas and migrations import @blog/config: a constant changed
      # there alone can stale the generated types or break a migration.
      # `full` mirrors turbo.json's globalDependencies plus the root manifests:
      # any of them changing drops `--affected`, so turbo's own detection is
      # not the only thing standing between a root change and a skipped task.
      # With no pull-request base every output is set, so a gated check runs
      # rather than skipping and reading as passed.
      - name: Compute path outputs
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          full=false
          studio=false
          env_presence=false
          scripts=false
          if [ -z "${BASE_SHA}" ] || [ -z "${HEAD_SHA}" ]; then
            echo "::notice::No pull-request base; setting every output."
            full=true
            studio=true
            env_presence=true
            scripts=true
          else
            changed="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
            while IFS= read -r file; do
              case "${file}" in
                configs/* | .github/actions/setup/* | .nvmrc | pnpm-lock.yaml | turbo.json | package.json | pnpm-workspace.yaml)
                  full=true ;;
              esac
              case "${file}" in
                packages/studio/* | packages/config/* | packages/utils/* | pnpm-lock.yaml)
                  studio=true ;;
              esac
              case "${file}" in
                env.ts | */env.ts | */oauth-env.ts | .github/workflows/ci.yml | scripts/check-required-env*)
                  env_presence=true ;;
              esac
              case "${file}" in
                scripts/*.mjs)
                  scripts=true ;;
              esac
            done <<< "${changed}"
          fi
          {
            echo "full=${full}"
            echo "studio=${studio}"
            echo "env-presence=${env_presence}"
            echo "scripts=${scripts}"
          } | tee -a "${GITHUB_OUTPUT}"

  # One install for every check that reads the source. Each step after setup
  # runs even when an earlier one failed, so one run reports every failure;
  # the step names are the job names they replaced.
  verify:
    name: Verify
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      FULL: ${{ needs.changes.outputs.full }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      # Full history serves turbo's `--affected` (a shallow clone runs
      # everything), the format step's diff against the base, and Migration
      # index, which reads the head commit and `origin/main` — this fetch,
      # made with the job token, is what creates that ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        id: setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # Only the files this pull request added or changed, so a file it did not
      # touch never fails it. Prettier skips anything `.prettierignore` names
      # even when passed explicitly, and `--ignore-unknown` skips file types it
      # cannot parse.
      - name: Format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ] || [ -z "${HEAD_SHA}" ]; then
            echo "::notice::No pull-request base; nothing to diff against."
            exit 0
          fi
          git diff --name-only --diff-filter=ACMR -z "${BASE_SHA}...${HEAD_SHA}" \
            | xargs -0 --no-run-if-empty pnpm exec prettier --check --ignore-unknown --no-error-on-unmatched-pattern

      - name: Type-check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          if [ "${FULL}" = 'true' ]; then
            pnpm turbo run type-check
          else
            pnpm turbo run type-check --affected
          fi

      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          if [ "${FULL}" = 'true' ]; then
            pnpm turbo run lint
          else
            pnpm turbo run lint --affected
          fi

      # `--treat-config-hints-as-errors` fails on an ignore or entry in
      # knip.json that no longer hides anything, so stale rules cannot rot
      # into ones that hide real findings later. Never `--fix`.
      - name: Knip
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm knip --reporter github-actions --treat-config-hints-as-errors

      # A `'use client'` module that can reach an `import 'server-only'` module
      # fails `next build` under the `react-server` condition — and nothing
      # else catches it, because every workspace aliases `@blog/<pkg>/*`
      # straight to that package's `src/`, so a deep import resolves whether or
      # not the package declares the subpath.
      - name: Client graph
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:client-graph

      # A tag passed to `isr(...)` in packages/service with no entry in
      # apps/web's REVALIDATE_TAGS silently purges nothing on publish.
      - name: Revalidate tags sync
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:revalidate-tags-sync

      # Turbo strict env mode strips any var missing from the `build` task's
      # `env` allowlist, so a var declared in an env.ts but not in turbo.json
      # silently disappears at build time.
      - name: Turbo env sync
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:turbo-env-sync

      # Drift, structure (a component folder that produced no entry or a slot
      # that did not resolve) and descriptions over packages/ui/COMPONENTS.md.
      - name: UI index
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm gen:ui-index:check

      # With no REQUIRED_ENV_ENVIRONMENT the script runs only its
      # classification half; presence is the Required env matrix's.
      - name: Required env classification
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:required-env

      # Judged on the pull request's own journal: the merge result checked out
      # here has already reconciled it with `main`'s.
      - name: Migration index
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          MIGRATION_INDEX_HEAD_REF: ${{ github.event.pull_request.head.sha || 'HEAD' }}
        run: pnpm check:migration-index

      # They import the repo's typescript, so they need this job's install
      # rather than the install-free Workflow security workflow.
      - name: Script helper tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node --test scripts/*.test.mjs

      # Drift guard: a schema change merged without `pnpm typegen` ships stale
      # but self-consistent types that type-check cannot catch. Typegen is
      # non-deterministic, so a mismatch gets three attempts before it counts
      # as drift. The trap puts the committed output back however the step
      # ends, so Build always compiles what the pull request committed.
      - name: Typegen
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.changes.outputs.studio == 'true' }}
        run: |
          set -euo pipefail
          generated=packages/config/src/sanity/generated
          trap 'git checkout HEAD -- "${generated}" && git clean -fdq -- "${generated}"' EXIT
          for attempt in 1 2 3; do
            (cd packages/studio && pnpm typegen)
            if [ -z "$(git status --porcelain -- "${generated}")" ]; then
              echo "Committed typegen output is current (attempt ${attempt})."
              exit 0
            fi
            echo "Attempt ${attempt}: regenerated output differs from committed output."
          done
          echo '::group::typegen drift (regenerated vs committed)'
          git status --porcelain -- "${generated}"
          git --no-pager diff --color=never -- "${generated}"
          echo '::endgroup::'
          echo "::error::Committed generated types in ${generated} are stale. Run 'pnpm typegen' locally and commit the regenerated files."
          exit 1

      # turbo's outputs exclude .next/cache, so a turbo cache miss would
      # otherwise recompile both apps from nothing. The restore key stops at
      # the lockfile, so no fallback serves a cache built against other
      # dependencies.
      - name: Cache Next.js build cache
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/*/.next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/*/src/**') }}
          restore-keys: |
            next-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # @blog/service validates its env at import time. CI has no Sanity env
      # vars and the build does not fetch, so validation is skipped here; it
      # still runs at deploy time on Vercel.
      - name: Build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: pnpm build

  test:
    name: Test
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 15
    steps:
      # `--affected` reads history back to the base; a shallow clone runs everything.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # Capped at two suites at a time: the default (10) oversubscribes the
      # runner and times out vitest hooks (#3364; docs/context/ci-automation.md).
      - name: Test
        env:
          FULL: ${{ needs.changes.outputs.full }}
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${FULL}" = 'true' ]; then
            pnpm turbo run test --concurrency=2
          else
            pnpm turbo run test --affected --concurrency=2
          fi

  required-env:
    name: Required env (${{ matrix.environment }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Scoping the job to the environment is what lets it see which names that
    # environment provides without any token: the `secrets`/`vars` contexts
    # resolve to that environment's own entries merged over the repo-level
    # ones. Listing environment secrets through the API would instead need
    # repo-admin scope, which neither the default GITHUB_TOKEN nor the
    # `public_repo + project` GH_PAT has.
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: [development, production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # Every `.optional()` env var declares whether it is genuinely optional
      # or merely optional at boot but required in a deployment environment;
      # this fails on an unmarked one, then checks the required ones are
      # actually provisioned here.
      #
      # Each input below is a boolean, not a value: the `!= ''` comparison runs
      # in GitHub's expression engine, so only `true`/`false` reaches the runner
      # and no secret value is exposed to the job at all. Passing
      # `toJSON(secrets)` would save maintaining this list, but injects every
      # secret into the runner's environment for no benefit.
      #
      # The list must cover every var marked `@env-required` for this
      # environment — the script fails and names the missing line if it does
      # not, so it cannot drift out of sync silently.
      #
      # `development` fails the run; `production` only warns while its known
      # gaps are open (BLOCKING_ENVIRONMENTS in the script decides, not this
      # file). Read-only; nothing is committed.
      - name: Env vars classified, and required ones present
        env:
          REQUIRED_ENV_ENVIRONMENT: ${{ matrix.environment }}
          REQUIRED_ENV_PRESENT_SANITY_REVALIDATE_SECRET: ${{ secrets.SANITY_REVALIDATE_SECRET != '' }}
          REQUIRED_ENV_PRESENT_SITE_CONFIG_REVALIDATE_SECRET: ${{ secrets.SITE_CONFIG_REVALIDATE_SECRET != '' }}
          REQUIRED_ENV_PRESENT_OPERATOR_ALERT_SECRET: ${{ secrets.OPERATOR_ALERT_SECRET != '' }}
          REQUIRED_ENV_PRESENT_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY != '' }}
          REQUIRED_ENV_PRESENT_TENANT_TOKEN_ENCRYPTION_KEY: ${{ secrets.TENANT_TOKEN_ENCRYPTION_KEY != '' }}
          REQUIRED_ENV_PRESENT_WEB_APP_URL: ${{ vars.WEB_APP_URL != '' }}
          REQUIRED_ENV_PRESENT_VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID != '' }}
          REQUIRED_ENV_PRESENT_VERCEL_PROJECT_ID_WEB: ${{ vars.VERCEL_PROJECT_ID_WEB != '' }}
        run: pnpm check:required-env

  migrations:
    name: Migrations
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read-only guard against broken content migrations. Content is live in
    # the `production` dataset, so a malformed or un-runnable migration must
    # not slip through. `sanity migrations list` loads + registers every
    # migration (fails on import errors / bad defineMigration). When a
    # read-only Sanity token is configured (repo/org secret
    # `SANITY_API_READ_TOKEN`), it additionally dry-runs each migration
    # against the dataset — this never mutates data (`sanity migrations run`
    # defaults to dry mode; `--no-dry-run` is never used here). Actually
    # applying a migration to production stays human-gated. Document-schema
    # validation against the live dataset lives in the
    # `document-validation.yml` workflow (advisory, not part of this required
    # check) — see that workflow's comment for why.
    env:
      SANITY_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate migrations load
        working-directory: packages/studio
        run: pnpm exec sanity migrations list

      - name: Dry-run migrations (read-only; requires SANITY_API_READ_TOKEN)
        if: ${{ env.SANITY_READ_TOKEN != '' }}
        working-directory: packages/studio
        env:
          # The Sanity CLI authenticates non-interactively from SANITY_AUTH_TOKEN.
          SANITY_AUTH_TOKEN: ${{ env.SANITY_READ_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in migrations/*/; do
            # Only dirs holding a migration — skips backups/ and any non-migration
            # folder, and is a no-op when there are zero migrations.
            [ -f "${dir}index.ts" ] || continue
            id="$(basename "${dir}")"
            echo "::group::dry-run ${id}"
            # Dry mode is the default — computes the diff, never writes.
            pnpm exec sanity migrations run "${id}"
            echo "::endgroup::"
          done

  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - verify
      - test
      - required-env
      - migrations
    # Without this a failed need skips the job, and a skipped check reads as
    # passed; `!cancelled()` rather than `always()` so a superseded run stops.
    if: ${{ !cancelled() }}
    steps:
      - name: Every needed job succeeded or was skipped
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
