name: Deploy Development

# TEMPORARY (2026-09-04) — READ FIRST: the `push` trigger is commented out, so
# NOTHING below runs on merge. The paragraph that follows describes the normal,
# currently-suspended behaviour. See the block above `on:` for why and how to
# restore it (#2648).
#
# The dev web app and dev admin panel deploy from here on merge to `main` — but
# only the app(s) whose turbo graph the merge actually touched (see the `changes`
# job), and ONLY after the `verify` gate (type-check/lint/test/build on the
# merged commit) passes. The Studio is not deployed: it ships as the
# `@blog/studio` package and is mounted by the admin panel, so `changes` tracks
# it only to decide whether the Sanity content migration needs to run. Vercel's
# native Git integration is disabled for both deployed projects declaratively via
# each app's own vercel.json `git.deploymentEnabled: false` (#445) so nothing
# deploys pre-merge or ungated — every dev deploy goes through this workflow.
# Mirrors deploy-production.yml, which deploys both apps unconditionally (a tag
# is a deliberate full release).
#
# TEMPORARY (2026-09-04): automatic deploy-on-merge is disabled to stay inside
# the Vercel metered-usage allowance during a low-development stretch. Dev
# deploys are manual — run this workflow from the Actions tab, or
# `gh workflow run deploy-development.yml`.
#
# Re-enable by uncommenting the `push:` trigger below. Do NOT instead leave the
# trigger active and skip the deploy jobs with an `if:` guard: the `changes` job
# anchors to the head_sha of the last SUCCESSFUL run of this workflow, so a run
# that succeeds with its deploys skipped advances the anchor past commits that
# were never deployed, and the next real run silently skips them. Not running at
# all leaves the anchor parked, which is what makes a later manual run cover
# every commit since.
#
# TODO(#2648): restore automatic deploy-on-merge.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Concurrency is scoped PER JOB, not workflow-wide, so the `migrate` job can be
# exempted from cancellation (#409). A workflow-level `cancel-in-progress: true`
# cancels the *entire* run — including a `migrate:deploy` that is mutating the
# dataset mid-transaction — when the next merge lands. Instead:
#   • changes / verify / deploy-* keep `cancel-in-progress: true` (their own
#     groups) — a newer merge still supersedes an in-flight build/deploy, so
#     "latest merge wins" is preserved for the cancel-safe jobs. Each job needs
#     a distinct group; jobs sharing one group would cancel each other in-run.
#   • migrate uses `cancel-in-progress: false` — a newer merge QUEUES behind a
#     running migration instead of interrupting it. GitHub keeps at most one
#     pending run per group (newer supersedes older pending), so rapid merges
#     collapse to "finish the current migration, then run the latest".
# Production keeps a workflow-level `cancel-in-progress: false` (never cancels).
#
# "Latest merge wins" is only lossless because change detection is anchored to
# the last commit this workflow COMPLETED SUCCESSFULLY against rather than to
# HEAD^1 (#2570) — see the `changes` job. A cancelled run leaves it where it
# stood, so the run
# that superseded it widens its own window to cover the cancelled commit too;
# cancellation costs deploy latency, never a lost deploy. Queueing the deploy
# jobs (`cancel-in-progress: false`) would NOT have fixed this on its own:
# GitHub cancels an older PENDING run when a newer one queues, so a middle merge
# can still be dropped while every deploy runs to completion.

env:
  PNPM_VERSION: 11.21.0
  NODE_VERSION: '24'
  VERCEL_CLI_VERSION: 48.0.0
  # Keep in lockstep with the `turbo` devDependency version.
  TURBO_IGNORE_VERSION: 2.10.4
  # Sanity project/dataset defaults, sourced from repo Variables like ci.yml.
  # The content `migrate` job overrides both explicitly, and nothing builds
  # the Studio in CI any more — `packages/studio` ships as a library and has
  # no `build` script — so these are a fallback rather than load-bearing.
  SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
  SANITY_STUDIO_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
  # Vercel Remote Cache — lets verify replay task artifacts already built by PR
  # CI instead of rebuilding. No-op until TURBO_TOKEN/TURBO_TEAM are configured.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Graph-aware change detection: turbo-ignore exits 0 when the package and its
  # workspace dependencies are untouched between the comparison ref and HEAD, 1
  # when a redeploy is needed. A `packages/config` change therefore redeploys
  # both apps; a docs-only merge deploys neither. workflow_dispatch bypasses the
  # gates below, so a manual run always deploys everything.
  #
  # That comparison ref is the head commit of the last SUCCESSFUL run of this
  # workflow on `main`, not HEAD^1 (#2570). HEAD^1 makes the window exactly one
  # merge wide, so a merge whose run is cancelled by the next one falls outside
  # every window that follows and is silently never deployed. Anchoring to the
  # last success needs no state of our own — GitHub's run history already is
  # that state — and it self-heals: a run that is cancelled or fails never
  # becomes the anchor, so the next merge re-evaluates every commit back to the
  # one this workflow last got all the way through.
  #
  # The anchor is a diff boundary, not an assertion that something shipped: a
  # docs-only merge and a run whose deploy step is a guarded no-op (its Vercel
  # token not configured yet) both conclude `success` and both advance it. That
  # is still correct — once a token is configured, the next real run inherits
  # the whole accumulated window rather than one merge of it.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reading this workflow's own run history is what resolves the anchor.
      actions: read
    concurrency:
      group: deploy-dev-changes
      cancel-in-progress: true
    outputs:
      studio: ${{ steps.studio.outputs.changed }}
      web: ${{ steps.web.outputs.changed }}
      admin: ${{ steps.admin.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the anchor can be many merges back after a run of
          # cancellations or failures, and both the ancestry check below and
          # turbo-ignore need that commit present locally.
          fetch-depth: 0

      # Runs come back newest-first; the first one that is an ancestor of HEAD
      # wins. A head_sha that no longer exists (rewritten history) or that isn't
      # an ancestor is skipped rather than trusted. An unreachable API — or a
      # rename of this file, which the query names literally — degrades to HEAD^1
      # with a warning: the pre-#2570 behaviour, which under-detects rather than
      # deploying everything, so a blip can't stampede both Vercel projects.
      - name: Resolve comparison ref
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # --verify, or rev-parse echoes its own argument back on failure and
          # the fallback below silently becomes the literal string "<sha>^1".
          parent=$(git rev-parse --verify "${HEAD_SHA}^1")
          if [ -z "$parent" ]; then
            echo "::error::Could not resolve ${HEAD_SHA}^1 — refusing to guess a comparison ref. The anchor stays where it is, so the next merge covers this commit too." >&2
            exit 1
          fi
          ref=""
          candidates=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-development.yml/runs?branch=main&status=success&exclude_pull_requests=true&per_page=50" --jq '.workflow_runs[].head_sha') || candidates=""
          for sha in $candidates; do
            if [ "$sha" = "$HEAD_SHA" ]; then
              continue
            fi
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              continue
            fi
            if ! git merge-base --is-ancestor "$sha" "$HEAD_SHA"; then
              continue
            fi
            ref="$sha"
            break
          done
          if [ -z "$ref" ]; then
            echo "::warning::No successful Deploy Development run found to compare against — falling back to HEAD^1, which cannot cover an earlier cancelled deploy."
            ref="$parent"
          elif [ "$ref" != "$parent" ]; then
            echo "::notice::Comparing against ${ref} (last commit this workflow completed successfully against), $(git rev-list --count "${ref}..${HEAD_SHA}") commits back — an earlier run was cancelled or failed, so this run covers its changes too."
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Is studio affected?
        id: studio
        env:
          BASE_REF: ${{ steps.baseline.outputs.ref }}
        run: |
          set -uo pipefail
          if npx --yes "turbo-ignore@${TURBO_IGNORE_VERSION}" @blog/studio --fallback="$BASE_REF"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Is web affected?
        id: web
        env:
          BASE_REF: ${{ steps.baseline.outputs.ref }}
        run: |
          set -uo pipefail
          if npx --yes "turbo-ignore@${TURBO_IGNORE_VERSION}" web --fallback="$BASE_REF"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Is admin affected?
        id: admin
        env:
          BASE_REF: ${{ steps.baseline.outputs.ref }}
        run: |
          set -uo pipefail
          if npx --yes "turbo-ignore@${TURBO_IGNORE_VERSION}" platform --fallback="$BASE_REF"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Gate: re-run the full suite on the exact merged commit before any deploy.
  # Deploy jobs `needs: verify`, so a dev deploy only happens after checks pass.
  # Skipped entirely (along with every deploy) when no app is affected.
  verify:
    name: Verify
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.studio == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-dev-verify
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - name: Type-check
        run: pnpm type-check
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: 'true'

  # Apply content migrations to the dev dataset BEFORE dev serves new code, so a
  # schema+migration merge can't leave dev's data behind its code (the #355
  # failure mode). No artifact backup here — dev is the disposable staging line
  # (also refreshed from prod by #363); prod keeps the backup + approval gate.
  # Gated on studio||web — the union of the jobs that `needs` it — rather than on
  # `verify`'s wider condition, so an admin-only merge doesn't run a Sanity
  # migration for an app that never touches Sanity; migrate is still never
  # skipped out from under a deploy that depends on it. migrate:deploy is a
  # no-op when nothing is pending, and every step is guarded on the token so
  # the job is inert until it's configured.
  migrate:
    name: Migrate dev content
    needs: [changes, verify]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.studio == 'true' ||
      needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The one job that must never be cancelled mid-run (#409): a dataset mutation
    # interrupted mid-transaction can leave a migration half-applied. `false`
    # queues a newer merge behind the running migration instead of cancelling it.
    concurrency:
      group: deploy-dev-migrate
      cancel-in-progress: false
    environment: development
    env:
      SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
      SANITY_STUDIO_DATASET: development
      # Content mutations need an Editor (write) token; a deploy-scoped token
      # gets "permission update required" on a real migration run.
      # Least-privilege: a dedicated migrate token.
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_MIGRATE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - name: Apply pending migrations
        if: ${{ env.SANITY_AUTH_TOKEN != '' }}
        working-directory: packages/studio
        run: pnpm migrate:deploy --yes

  # Apply Drizzle/db schema migrations to the dev Neon branch BEFORE dev
  # serves new code — the same "code never ships ahead of a pending
  # migration" discipline as the content `migrate` job above, for the
  # separate relational store (`packages/db`, see .claude/agents/db.md's
  # "Migrations" section). `deploy-web` and `deploy-admin` both depend on
  # `@blog/db` (the Studio never touches Postgres), so this is gated on
  # web||admin, not `studio`, and only those two need it below. No artifact backup here — dev is the disposable staging line, same
  # stance as the content migrate job. `drizzle-kit migrate` is a no-op when nothing is
  # pending, and the apply step is guarded on DATABASE_URL_UNPOOLED so the
  # job is inert until that secret is configured. No approval gate on dev,
  # same as the content migrate job.
  migrate-db:
    name: Migrate dev database
    needs: [changes, verify]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same reasoning as `migrate` above (#409) — never cancel a running
    # migration mid-transaction; a newer merge queues behind it instead.
    concurrency:
      group: deploy-dev-migrate-db
      cancel-in-progress: false
    environment: development
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      # Non-secret: a bare Neon connection host alone can't authenticate
      # anything, so this is safe as a plain repo Variable — but it must be
      # a HOSTNAME ONLY (e.g. ep-xxxx.us-east-2.aws.neon.tech), never a full
      # `postgresql://...` connection string. The guard step below fails the
      # job outright if it's unset or malformed, rather than silently skipping.
      PRODUCTION_DB_HOST: ${{ vars.PRODUCTION_DB_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A job's `environment:` scopes it to that environment's own secrets —
      # this job can never see production's DATABASE_URL_UNPOOLED to compare
      # directly, so the production host is mirrored into a repo Variable
      # instead (see PRODUCTION_DB_HOST above). Runs before setup/migrate so a
      # mis-set secret fails loudly and fast, before anything touches the db.
      # Uses `node`'s URL parser (preinstalled on GitHub-hosted runners, ahead
      # of our own pinned setup step) rather than a regex, so a literal `@` or
      # `:` in the password can't fool the host extraction — and an
      # unparseable connection string fails the job instead of silently
      # skipping the check.
      - name: Guard against a mis-set production target
        if: ${{ env.DATABASE_URL_UNPOOLED != '' }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_DB_HOST:-}" ]; then
            echo "::error::PRODUCTION_DB_HOST is unset — refusing to migrate without the production-host guard in place. Set it as a repo-level Variable (see docs/DEPLOY.md)." >&2
            exit 1
          fi
          # A bare hostname is letters/digits/dots/hyphens only — a scheme,
          # '@', ':', or '/' means someone pasted a full connection string.
          if ! [[ "$PRODUCTION_DB_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::PRODUCTION_DB_HOST does not look like a bare hostname — it may hold a full connection string. Expected only the host portion (e.g. ep-xxxx.us-east-2.aws.neon.tech). Check the repo-level Variable." >&2
            exit 1
          fi
          host=$(node -e "console.log(new URL(process.env.DATABASE_URL_UNPOOLED).hostname)") || {
            echo "::error::could not parse a host out of DATABASE_URL_UNPOOLED — check the development Environment's secret is a valid connection string." >&2
            exit 1
          }
          if [ "$host" = "$PRODUCTION_DB_HOST" ]; then
            echo "::error::development migrate-db resolved to the PRODUCTION Neon branch host ($host) — refusing to migrate. Check the development Environment's DATABASE_URL_UNPOOLED secret." >&2
            exit 1
          fi
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - name: Apply pending db migrations
        if: ${{ env.DATABASE_URL_UNPOOLED != '' }}
        run: pnpm --filter @blog/db db:migrate

  deploy-web:
    name: Deploy dev web
    needs: [changes, verify, migrate, migrate-db]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-dev-web
      cancel-in-progress: true
    environment: development
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Org/project ids are not sensitive — they live as environment-scoped
      # Variables (not Secrets) so they stay inspectable in run logs.
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_WEB }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm + node on PATH so `vercel build` can install the workspace deps
      # (Vercel detects pnpm-lock.yaml and shells out to `pnpm`).
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # Deploys `web-dev` via the Vercel CLI (its Git auto-deploy is disabled).
      # For `web-dev`, Vercel "production" = main, so --prod targets its main
      # URL. No-op (green) until the development environment's VERCEL_* secrets
      # exist.
      - name: Deploy to Vercel (web-dev)
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          set -euo pipefail
          # Without both ids the CLI silently auto-links to whatever project
          # matches the directory name — fail loudly instead.
          : "${VERCEL_ORG_ID:?empty — set the VERCEL_ORG_ID Variable on the development environment}"
          : "${VERCEL_PROJECT_ID:?empty — set the VERCEL_PROJECT_ID_WEB Variable on the development environment}"
          # npx (not `npm install -g`) keeps zizmor's ad-hoc-install audit
          # green; the package is cached after the first resolution.
          npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod --token="$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-admin:
    name: Deploy dev admin
    needs: [changes, verify, migrate-db]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-dev-admin
      cancel-in-progress: true
    environment: development
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Org/project ids are not sensitive — they live as environment-scoped
      # Variables (not Secrets) so they stay inspectable in run logs.
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      # Distinct GitHub Environment variable from deploy-web's VERCEL_PROJECT_ID_WEB
      # (platform-dev is its own Vercel project, rooted at apps/platform) — mapped to
      # the local name the Vercel CLI actually reads.
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_PLATFORM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm + node on PATH so `vercel build` can install the workspace deps
      # (Vercel detects pnpm-lock.yaml and shells out to `pnpm`).
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # Deploys `platform-dev` via the Vercel CLI (its Git auto-deploy is disabled,
      # same as web). For `platform-dev`, Vercel "production" = main, so
      # --prod targets its main URL. Guarded on VERCEL_PROJECT_ID (not
      # VERCEL_TOKEN, which deploy-web already has configured) so this stays a
      # true no-op until the platform-dev Vercel project exists and
      # VERCEL_PROJECT_ID_PLATFORM is set.
      - name: Deploy to Vercel (platform-dev)
        if: ${{ env.VERCEL_PROJECT_ID != '' }}
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?empty — set the VERCEL_TOKEN secret on the development environment}"
          : "${VERCEL_ORG_ID:?empty — set the VERCEL_ORG_ID Variable on the development environment}"
          # npx (not `npm install -g`) keeps zizmor's ad-hoc-install audit
          # green; the package is cached after the first resolution.
          npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod --token="$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --token="$VERCEL_TOKEN"
