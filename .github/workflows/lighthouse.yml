name: Lighthouse CI

# Advisory Lighthouse CI budget assertions (#399) against production's `/` and
# one post page, on manual dispatch only. Thresholds live in
# .lighthouse/budgets.json (documented in .lighthouse/README.md).
#
# LIGHTHOUSE_URLS points at PRODUCTION, not a per-PR preview or `development`:
# web has no PR preview deploys, and dev is deliberately `noindex, nofollow`
# (#841), which permanently fails the SEO crawlability audit, and carries
# cold-start noise (#826). So a run checks production's current health, not
# any diff's, which is why nothing triggers it automatically.
#
# No-op (green) if the repo Variable LIGHTHOUSE_URLS is unset.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI budgets
    runs-on: ubuntu-latest
    # numberOfRuns: 3 (.lighthouse/budgets.json) roughly triples this job's
    # Lighthouse passes (2 URLs × 3 runs) — bumped from 10 to keep headroom.
    timeout-minutes: 15
    env:
      # One full URL per line — production's `/` and one post page (see the
      # workflow header comment for why production, not dev or a preview). A
      # repo Variable (not a Secret): production URLs aren't sensitive and
      # this keeps the value inspectable in run logs.
      LIGHTHOUSE_URLS: ${{ vars.LIGHTHOUSE_URLS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Non-required/advisory (per #399's constraints) — promoting this to a
      # required check is a separate, human-gated branch-ruleset decision.
      # Guarded on LIGHTHOUSE_URLS so the job is inert (green) if the Variable
      # is ever unset; see the workflow header comment above.
      - name: Run Lighthouse CI budgets
        if: ${{ env.LIGHTHOUSE_URLS != '' }}
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: ${{ env.LIGHTHOUSE_URLS }}
          configPath: .lighthouse/budgets.json
          uploadArtifacts: true
          artifactName: lighthouse-results
