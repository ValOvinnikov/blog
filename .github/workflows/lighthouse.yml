name: Lighthouse CI

# Advisory Lighthouse CI budget assertions (#399) against a stable, known URL
# for `/` and one post page, on every push to main (post-merge). Thresholds
# live in .lighthouse/budgets.json (documented in .lighthouse/README.md).
#
# LIGHTHOUSE_URLS points at PRODUCTION (https://{your-hosting}), not a per-PR
# preview: this repo has no PR preview deploys for web by design (Vercel's
# native Git auto-deploy is disabled — apps/web/vercel.json,
# git.deploymentEnabled: false, #445/#446; see SPEC.md §13), and no per-PR
# preview/smoke-URL mechanism is currently tracked (#275 closed without
# delivering one — see .lighthouse/README.md). The `development`
# deployment was tried first (#399) but is unsuitable as a Lighthouse target:
# it can serve content byte-identical to production after a dataset refresh
# yet is deliberately `noindex, nofollow` (#841), which permanently fails the
# SEO category's crawlability audit — plus dev carries cold-start/unwarmed-ISR
# performance noise unrelated to any PR's changes (#826). Production is the
# only environment where the budgets reflect real, indexable behavior. This
# means the job checks production's current health on every merge rather
# than that merge's own diff — an accepted limitation until a true per-PR
# preview target exists (none is currently tracked); it's still a useful
# early-warning budget, and stays advisory (non-required) per #399.
#
# No-op (green) if the repo Variable LIGHTHOUSE_URLS is ever unset — mirrors
# the guarded-step pattern in deploy-development.yml (steps check
# `env.SOME_TOKEN != ''` and no-op green until configured).
#
# Runs on push to main (post-merge), not on every PR push: it was
# structurally a no-op on PRs anyway (same production URLs, no per-PR
# preview to diff against), so a PR-push trigger bought no signal.
# `workflow_dispatch` keeps a manual trigger available.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A subsequent push to main supersedes the running job for the same ref.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI budgets
    runs-on: ubuntu-latest
    # numberOfRuns: 3 (.lighthouse/budgets.json) roughly triples this job's
    # Lighthouse passes (2 URLs × 3 runs) — bumped from 10 to keep headroom.
    timeout-minutes: 15
    env:
      # One full URL per line — production's `/` and one post page (see the
      # workflow header comment for why production, not dev or a preview). A
      # repo Variable (not a Secret): production URLs aren't sensitive and
      # this keeps the value inspectable in run logs.
      LIGHTHOUSE_URLS: ${{ vars.LIGHTHOUSE_URLS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Non-required/advisory (per #399's constraints) — promoting this to a
      # required check is a separate, human-gated branch-ruleset decision.
      # Guarded on LIGHTHOUSE_URLS so the job is inert (green) if the Variable
      # is ever unset; see the workflow header comment above.
      - name: Run Lighthouse CI budgets
        if: ${{ env.LIGHTHOUSE_URLS != '' }}
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: ${{ env.LIGHTHOUSE_URLS }}
          configPath: .lighthouse/budgets.json
          uploadArtifacts: true
          artifactName: lighthouse-results
