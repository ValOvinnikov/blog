name: Workflow security

on:
  # Never path- or branch-filtered: this check is required, and a skipped
  # required check sits "Pending" forever instead of failing (see ci.yml).
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIZMOR_VERSION: 1.26.1
  ACTIONLINT_VERSION: 1.7.12
  # sha256 of actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz, from the
  # release's checksums.txt — bump both together.
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Zizmor
        # --format=sarif always exits 0; --format=github keeps zizmor's
        # non-zero exit on findings. Accepted findings carry an inline `zizmor: ignore`.
        run: uvx "zizmor@${ZIZMOR_VERSION}" --format=github .github/workflows/ .github/actions/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Actionlint
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --silent --show-error --location --fail \
            --output "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          (cd "${RUNNER_TEMP}" && echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict -)
          tar --extract --gzip --file "${RUNNER_TEMP}/${tarball}" --directory "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

      - name: Shellcheck .claude/hooks and scripts
        # Actionlint shellchecks only workflow run: blocks, never standalone scripts.
        run: shellcheck .claude/hooks/*.sh scripts/*.sh

      - name: Guard tests
        run: |
          set -eu
          bash .claude/hooks/read-only-agent-guard.test.sh
          sh .claude/hooks/gate-bypass-guard.test.sh
          sh .claude/hooks/pre-bash-worktree-install-guard.test.sh
          sh .claude/hooks/pre-bash-branch-name-guard.test.sh
          bash .claude/hooks/test-writer-scope-guard.test.sh
          bash .claude/hooks/pre-agent-gate0-guard.test.sh
          bash .claude/hooks/post-edit.test.sh
          bash .claude/hooks/subagent-stop-commit-guard.test.sh
          bash .claude/hooks/layer-scope-guard.test.sh
          bash .claude/hooks/board-keeper-graphql-guard.test.sh
          sh scripts/vercel-ignore-affected.test.sh
