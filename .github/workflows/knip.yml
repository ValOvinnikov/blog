name: Knip

on:
  # No path filter — same reasoning as ci.yml / actionlint.yml. Dead code is
  # almost never created by editing the file that dies: deleting the last
  # import of a module is what orphans it, so filtering on the orphan's own
  # path would miss exactly the change that caused it. Keeping every PR in
  # scope also matters because Knip is a required status check: a run skipped
  # by a path filter would sit "Pending" forever. No base-branch filter
  # either, for the reason ci.yml spells out: a PR based on anything but
  # `main` would otherwise skip this check entirely.
  pull_request:

permissions:
  contents: read

# A force-push/synchronize supersedes the running job for the same ref.
concurrency:
  group: knip-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.21.0
  NODE_VERSION: '24'

jobs:
  knip:
    name: Knip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # Read-only: reports unused files/exports/dependencies and exits non-zero
      # on any finding. Never `--fix` — deleting code is a human decision.
      #
      # `--treat-config-hints-as-errors` keeps knip.json itself honest: an
      # ignore or entry that has become unnecessary (because the code it
      # covered was fixed or deleted) fails the job instead of silently
      # rotting into a rule that hides real findings later.
      #
      # The github-actions reporter annotates the offending lines in the PR's
      # Files-changed view; the plain summary still prints to the job log.
      - name: Knip
        run: pnpm knip --reporter github-actions --treat-config-hints-as-errors

  knip-production:
    name: Knip (production graph, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ADVISORY — not a required check, and the step below always exits 0 so
    # the check itself stays green: `continue-on-error` alone keeps the *run*
    # green but still reports the job as failed, which is the exact noise
    # `document-validation` in ci.yml is being moved out of (every PR looks
    # broken to ci-watcher). The github-actions reporter still annotates each
    # finding in the PR's Files-changed view. `--production` drops test files,
    # stories and other dev entries from the import graph, so what it reports
    # is code only tests reach — an export kept alive to be asserted, a helper
    # whose last real consumer was deleted. Each hit is a candidate for the
    # test-only-exports cleanup (#3376), never a blocker for the PR at hand.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Knip (production graph)
        run: pnpm knip --production --reporter github-actions || true
