name: Deploy Production

on:
  push:
    tags: ['v*']
  # release.yml calls this after it has run the database and content
  # migrations itself, so the callable path deploys `tag` without repeating
  # them.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read

# Never cancel an in-flight production deploy.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  PNPM_VERSION: 11.21.0
  NODE_VERSION: '24'
  VERCEL_CLI_VERSION: 59.11.7
  SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
  SANITY_STUDIO_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}

jobs:
  # Every deploy job requires this to have succeeded, so a failed or skipped
  # gate skips the deploy rather than letting it through.
  full-gate:
    name: Full gate
    # Inherited rather than listed, as in full-gate.yml: ci.yml's Required env
    # matrix checks every secret marked `@env-required`.
    uses: ./.github/workflows/full-gate.yml # zizmor: ignore[secrets-inherit]
    with:
      ref: ${{ inputs.tag }}
    secrets: inherit

  # Content and database migrations run before any new code is served. On the
  # callable path release.yml has already run both.
  migrate:
    name: Migrate prod content
    needs: full-gate
    if: ${{ !inputs.tag }}
    uses: ./.github/workflows/migrate-production-content.yml # zizmor: ignore[secrets-inherit]
    with:
      label: ${{ github.ref_name }}
    secrets: inherit

  migrate-db:
    name: Migrate prod database
    needs: full-gate
    if: ${{ !inputs.tag }}
    uses: ./.github/workflows/migrate-production-database.yml # zizmor: ignore[secrets-inherit]
    with:
      label: ${{ github.ref_name }}
    secrets: inherit

  deploy-web:
    name: Stage prod web
    needs: [full-gate, migrate, migrate-db]
    # A migration job is skipped only on the callable path, where release.yml
    # has already run it; anything else short of success blocks the deploy.
    if: >-
      ${{ !cancelled() && needs.full-gate.result == 'success' &&
      (needs.migrate.result == 'success' || (inputs.tag && needs.migrate.result == 'skipped')) &&
      (needs.migrate-db.result == 'success' || (inputs.tag && needs.migrate-db.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    outputs:
      url: ${{ steps.stage.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET_WEB: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET_WEB }}
      # Org/project ids are not sensitive — they live as environment-scoped
      # Variables (not Secrets) so they stay inspectable in run logs.
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_WEB }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      # pnpm + node on PATH so `vercel build` can install the workspace deps
      # (Vercel detects pnpm-lock.yaml and shells out to `pnpm`).
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      # Vercel CLI runs its own `next build` with the project's Production env
      # vars pulled from Vercel (root directory apps/web is stored on the
      # project, so build resolves the monorepo workspaces correctly).
      - name: Stage on Vercel (web-prod)
        id: stage
        run: |
          set -euo pipefail
          # Every value is checked here rather than in an `if:`, because a
          # skipped step reports green and a release that shipped nothing would
          # look successful. Without both ids the CLI also silently auto-links
          # to whatever project matches the directory name.
          : "${VERCEL_TOKEN:?empty — set the VERCEL_TOKEN secret on the production environment}"
          : "${VERCEL_ORG_ID:?empty — set the VERCEL_ORG_ID Variable on the production environment}"
          : "${VERCEL_PROJECT_ID:?empty — set the VERCEL_PROJECT_ID_WEB Variable on the production environment}"
          # npx (not `npm install -g`) keeps zizmor's ad-hoc-install audit
          # green; the package is cached after the first resolution.
          npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"
          # A Sensitive var reaches this runner as the literal `[SENSITIVE]`, so the
          # build skips env validation. The script validates instead: it starts
          # the new deployment with the real env and stages it only if it starts.
          # Skew Protection needs a deployment id unique per project, a rerun included.
          BUILD_DEPLOYMENT_ID="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            SKIP_ENV_VALIDATION=true npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod --token="$VERCEL_TOKEN"
          bash scripts/vercel-deploy-checked.sh stage web /

  deploy-platform:
    name: Stage prod platform
    needs: [full-gate, migrate-db]
    if: >-
      ${{ !cancelled() && needs.full-gate.result == 'success' &&
      (needs.migrate-db.result == 'success' || (inputs.tag && needs.migrate-db.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    outputs:
      url: ${{ steps.stage.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET_PLATFORM: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET_PLATFORM }}
      # Org/project ids are not sensitive — they live as environment-scoped
      # Variables (not Secrets) so they stay inspectable in run logs.
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      # Distinct GitHub Environment variable from deploy-web's VERCEL_PROJECT_ID_WEB
      # (platform-prod is its own Vercel project, rooted at apps/platform) — mapped to
      # the local name the Vercel CLI actually reads.
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_PLATFORM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      # pnpm + node on PATH so `vercel build` can install the workspace deps
      # (Vercel detects pnpm-lock.yaml and shells out to `pnpm`).
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      # Vercel CLI runs its own `next build` with the project's Production env
      # vars pulled from Vercel (root directory apps/platform is stored on the
      # project, so build resolves the monorepo workspaces correctly).
      - name: Stage on Vercel (platform-prod)
        id: stage
        run: |
          set -euo pipefail
          # Every value is checked here rather than in an `if:`, because a
          # skipped step reports green — a tag that shipped the web app but not
          # the admin panel would otherwise look like a complete release.
          : "${VERCEL_TOKEN:?empty — set the VERCEL_TOKEN secret on the production environment}"
          : "${VERCEL_ORG_ID:?empty — set the VERCEL_ORG_ID Variable on the production environment}"
          : "${VERCEL_PROJECT_ID:?empty — set the VERCEL_PROJECT_ID_PLATFORM Variable on the production environment}"
          # npx (not `npm install -g`) keeps zizmor's ad-hoc-install audit
          # green; the package is cached after the first resolution.
          npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"
          # A Sensitive var reaches this runner as the literal `[SENSITIVE]`, so the
          # build skips env validation. The script validates instead: it starts
          # the new deployment with the real env and stages it only if it starts.
          # Skew Protection needs a deployment id unique per project, a rerun included.
          BUILD_DEPLOYMENT_ID="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            SKIP_ENV_VALIDATION=true npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod --token="$VERCEL_TOKEN"
          bash scripts/vercel-deploy-checked.sh stage platform /

  # A release is all or nothing: neither app is promoted until both have passed
  # their checks. A tag always deploys both, so a skipped stage job blocks too.
  promote:
    name: Promote prod apps
    needs: [full-gate, migrate, migrate-db, deploy-web, deploy-platform]
    if: ${{ !cancelled() && needs.full-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Both apps passed their checks
        env:
          NEEDS: ${{ toJSON(needs) }}
          REQUIRED_JOBS: deploy-web deploy-platform
        run: bash scripts/vercel-deploy-checked.sh gate

      - name: Promote web-prod
        env:
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_WEB }}
          URL: ${{ needs.deploy-web.outputs.url }}
        run: |
          set -euo pipefail
          : "${VERCEL_PROJECT_ID:?empty — set the VERCEL_PROJECT_ID_WEB Variable on the production environment}"
          bash scripts/vercel-deploy-checked.sh promote web "$URL"

      - name: Promote platform-prod
        env:
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_PLATFORM }}
          URL: ${{ needs.deploy-platform.outputs.url }}
        run: |
          set -euo pipefail
          : "${VERCEL_PROJECT_ID:?empty — set the VERCEL_PROJECT_ID_PLATFORM Variable on the production environment}"
          bash scripts/vercel-deploy-checked.sh promote platform "$URL"
