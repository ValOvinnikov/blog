name: Deploy Production

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never cancel an in-flight production deploy.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  PNPM_VERSION: 11.21.0
  NODE_VERSION: '22'
  VERCEL_CLI_VERSION: 48.0.0
  # `sanity build` (run by the verify job's `pnpm build`) loads sanity.cli.ts,
  # which requires these. Sourced from repo Variables like ci.yml; the
  # deploy-studio job overrides SANITY_STUDIO_PROJECT_ID from its
  # environment-scoped variable and hardcodes SANITY_STUDIO_DATASET (no
  # environment-scoped variable exists for it — see deploy-studio's own env
  # block below for why).
  SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
  SANITY_STUDIO_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
  # Vercel Remote Cache — lets verify replay task artifacts already built by PR
  # CI instead of rebuilding. No-op until TURBO_TOKEN/TURBO_TEAM are configured.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # A tag can point at ANY commit with no PR gate, so re-run the full suite on
  # the exact tagged commit before anything is promoted to production.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - name: Type-check
        run: pnpm type-check
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: 'true'

  # Apply any un-applied content migrations to production BEFORE new code is
  # served. `environment: production` gates this on the required reviewer (the
  # human check), and every step is guarded on the migrate token so the whole job
  # is a no-op until SANITY_MIGRATE_TOKEN is configured — safe to land ahead of
  # the console setup.
  migrate:
    name: Migrate prod content
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
      SANITY_STUDIO_DATASET: production
      # Content mutations need an Editor (write) token; the deploy token only has
      # Deploy-Studio permission and gets "permission update required" on a real
      # migration run. Least-privilege: a dedicated migrate token, separate from
      # deploy-studio's deploy-only token.
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_MIGRATE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      # A backup on the ephemeral runner is not a backup — export the dataset and
      # upload it as an artifact BEFORE any mutation, so a bad migration is
      # recoverable.
      - name: Back up production dataset
        if: ${{ env.SANITY_AUTH_TOKEN != '' }}
        working-directory: apps/cms
        run: pnpm dataset:export "${RUNNER_TEMP}/prod-${GITHUB_REF_NAME}.tar.gz"
      - name: Upload backup artifact
        if: ${{ env.SANITY_AUTH_TOKEN != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanity-prod-backup-${{ github.ref_name }}
          path: ${{ runner.temp }}/prod-${{ github.ref_name }}.tar.gz
          retention-days: 30
          if-no-files-found: error
      # Runs only un-applied migrations (dry -> run -> record in the
      # migrationState ledger), idempotent — a second run is a no-op. CI sets
      # CI=true which (with --yes) skips the interactive confirm; the approval
      # gate above is the real human check.
      - name: Apply pending migrations
        if: ${{ env.SANITY_AUTH_TOKEN != '' }}
        working-directory: apps/cms
        run: pnpm migrate:deploy --yes

  # Apply any un-applied Drizzle/db schema migrations to production BEFORE
  # new code is served — the same discipline as the content `migrate` job
  # above, for the separate relational store (`packages/db`, see
  # .claude/agents/db.md's "Migrations" section). `environment: production`
  # reuses the SAME required-reviewer gate as every other production job —
  # no second approval mechanism. Every step is guarded on
  # DATABASE_URL_UNPOOLED so the whole job is a no-op until that secret is
  # configured — safe to land ahead of the console setup. `deploy-web` and
  # `deploy-admin` both depend on `@blog/db` (apps/cms never touches
  # Postgres), so only those two `need` this job below.
  migrate-db:
    name: Migrate prod database
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      # Bare Neon connection host, repo-scoped so both this guard and the dev
      # guard in deploy-development.yml read the same value (#2264) — a job
      # scoped to `environment: production` falls through to the repo-level
      # Variable exactly like the dev job's `environment: development` falls
      # through when no environment-scoped variable of the same name shadows
      # it. Never a full `postgresql://...` connection string.
      PRODUCTION_DB_HOST: ${{ vars.PRODUCTION_DB_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Inverse of deploy-development.yml's migrate-db guard (#2057): dev
      # fails when its secret resolves to the PRODUCTION host, so this job
      # fails when its own secret resolves to anything ELSE — a production
      # release must never migrate the wrong Neon branch. Runs before
      # setup/backup/migrate so a mis-set secret fails loudly and fast,
      # before anything touches the db. Uses node's URL parser rather than a
      # regex, same reasoning as the dev guard: a literal `@` or `:` in the
      # password can't fool the host extraction, and an unparseable
      # connection string fails the job instead of silently skipping the
      # check.
      - name: Guard against a mis-set production target
        if: ${{ env.DATABASE_URL_UNPOOLED != '' }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_DB_HOST:-}" ]; then
            echo "::error::PRODUCTION_DB_HOST is unset — refusing to migrate without the production-host guard in place. Set it as a repo-level Variable (see docs/DEPLOY.md)." >&2
            exit 1
          fi
          # A bare hostname is letters/digits/dots/hyphens only — a scheme,
          # '@', ':', or '/' means someone pasted a full connection string.
          if ! [[ "$PRODUCTION_DB_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::PRODUCTION_DB_HOST does not look like a bare hostname — it may hold a full connection string. Expected only the host portion (e.g. ep-xxxx.us-east-2.aws.neon.tech). Check the repo-level Variable." >&2
            exit 1
          fi
          host=$(node -e "console.log(new URL(process.env.DATABASE_URL_UNPOOLED).hostname)") || {
            echo "::error::could not parse a host out of DATABASE_URL_UNPOOLED — check the production Environment's secret is a valid connection string." >&2
            exit 1
          }
          if [ "$host" != "$PRODUCTION_DB_HOST" ]; then
            echo "::error::production migrate-db resolved to a host ($host) that does NOT match the production Neon branch (${PRODUCTION_DB_HOST}) — refusing to migrate. Check the production Environment's DATABASE_URL_UNPOOLED secret." >&2
            exit 1
          fi
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      # A backup on the ephemeral runner is not a backup — pg_dump the
      # production Neon branch and upload it as an artifact BEFORE any
      # mutation, mirroring the Sanity job's dataset-export-before-mutate
      # step above. Custom format (-Fc, via --format=custom) so it restores
      # with `pg_restore` against a fresh Neon branch if a migration needs
      # to be undone. `pg_dump` refuses to dump from a server newer than
      # itself, and Ubuntu's default `postgresql-client` package trails
      # Neon's Postgres major version, so the PGDG apt repo installs a
      # client matching the server. The runner image's preinstalled v16
      # client owns the unversioned `pg_dump` on `PATH` as a real binary,
      # not a Debian alternatives symlink, so installing v17 alongside it
      # doesn't repoint `pg_dump` — the versioned binary under
      # `/usr/lib/postgresql/17/bin/` has to be invoked explicitly.
      - name: Back up production database
        if: ${{ env.DATABASE_URL_UNPOOLED != '' }}
        run: |
          set -euo pipefail
          PG_VERSION=17
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update -y
          sudo apt-get install -y "postgresql-client-${PG_VERSION}"
          "/usr/lib/postgresql/${PG_VERSION}/bin/pg_dump" "$DATABASE_URL_UNPOOLED" --format=custom --file="${RUNNER_TEMP}/prod-db-${GITHUB_REF_NAME}.dump"
      - name: Upload backup artifact
        if: ${{ env.DATABASE_URL_UNPOOLED != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: db-prod-backup-${{ github.ref_name }}
          path: ${{ runner.temp }}/prod-db-${{ github.ref_name }}.dump
          retention-days: 30
          if-no-files-found: error
      # Runs only un-applied migrations, tracked in drizzle-kit's own
      # journal under packages/db/migrations/meta — idempotent, a second run
      # is a no-op. The `production` environment's required reviewer above
      # is the human approval gate (same one every other prod job uses).
      - name: Apply pending db migrations
        if: ${{ env.DATABASE_URL_UNPOOLED != '' }}
        run: pnpm --filter @blog/db db:migrate

  deploy-studio:
    name: Deploy prod Studio
    needs: [verify, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Org/project ids are not sensitive — they live as environment-scoped
      # Variables (not Secrets) so they stay inspectable in run logs.
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      # Distinct GitHub Environment variable from deploy-web's VERCEL_PROJECT_ID
      # (cms-prod is its own Vercel project) — mapped to the local name the
      # Vercel CLI actually reads.
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_CMS }}
      # The `production` GitHub Environment only defines SANITY_STUDIO_PROJECT_ID
      # as an environment-scoped variable, not SANITY_STUDIO_DATASET — without
      # this override, `vars.SANITY_STUDIO_DATASET` (workflow-level env above)
      # falls through to the repo-level default ("development"), which `sanity
      # build` then bakes into the deployed Studio bundle. Hardcoded here rather
      # than sourced from vars, mirroring the migrate job's existing override.
      SANITY_STUDIO_DATASET: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm + node on PATH so `vercel build` can install the workspace deps
      # (Vercel detects pnpm-lock.yaml and shells out to `pnpm`).
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      # Deploys `cms-prod` (static `sanity build` output, apps/cms/vercel.json)
      # via the Vercel CLI — its Git auto-deploy is disabled, same as web.
      # Guarded on VERCEL_PROJECT_ID (not VERCEL_TOKEN, which deploy-web
      # already has configured) so this stays a true no-op until the cms-prod
      # Vercel project exists and VERCEL_PROJECT_ID_CMS is set.
      # Vercel CLI runs its own `sanity build` with the project's Production
      # env vars pulled from Vercel (root directory apps/cms is stored on the
      # project, so build resolves the monorepo workspaces correctly).
      - name: Deploy to Vercel (cms-prod)
        if: ${{ env.VERCEL_PROJECT_ID != '' }}
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?empty — set the VERCEL_TOKEN secret on the production environment}"
          : "${VERCEL_ORG_ID:?empty — set the VERCEL_ORG_ID Variable on the production environment}"
          # npx (not `npm install -g`) keeps zizmor's ad-hoc-install audit
          # green; the package is cached after the first resolution.
          npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod --token="$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-web:
    name: Deploy prod web
    needs: [verify, migrate, migrate-db]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Org/project ids are not sensitive — they live as environment-scoped
      # Variables (not Secrets) so they stay inspectable in run logs.
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm + node on PATH so `vercel build` can install the workspace deps
      # (Vercel detects pnpm-lock.yaml and shells out to `pnpm`).
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      # Vercel CLI runs its own `next build` with the project's Production env
      # vars pulled from Vercel (root directory apps/web is stored on the
      # project, so build resolves the monorepo workspaces correctly).
      - name: Deploy to Vercel (production)
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          set -euo pipefail
          # Without both ids the CLI silently auto-links to whatever project
          # matches the directory name — fail loudly instead.
          : "${VERCEL_ORG_ID:?empty — set the VERCEL_ORG_ID Variable on the production environment}"
          : "${VERCEL_PROJECT_ID:?empty — set the VERCEL_PROJECT_ID Variable on the production environment}"
          # npx (not `npm install -g`) keeps zizmor's ad-hoc-install audit
          # green; the package is cached after the first resolution.
          npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod --token="$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-admin:
    name: Deploy prod admin
    needs: [verify, migrate-db]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Org/project ids are not sensitive — they live as environment-scoped
      # Variables (not Secrets) so they stay inspectable in run logs.
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      # Distinct GitHub Environment variable from deploy-web's VERCEL_PROJECT_ID
      # (platform-prod is its own Vercel project, rooted at apps/platform) — mapped to
      # the local name the Vercel CLI actually reads.
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_ADMIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm + node on PATH so `vercel build` can install the workspace deps
      # (Vercel detects pnpm-lock.yaml and shells out to `pnpm`).
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      # Vercel CLI runs its own `next build` with the project's Production env
      # vars pulled from Vercel (root directory apps/platform is stored on the
      # project, so build resolves the monorepo workspaces correctly). Guarded
      # on VERCEL_PROJECT_ID (not VERCEL_TOKEN, which deploy-web already has
      # configured) so this stays a true no-op until the platform-prod Vercel
      # project exists and VERCEL_PROJECT_ID_ADMIN is set.
      - name: Deploy to Vercel (platform-prod)
        if: ${{ env.VERCEL_PROJECT_ID != '' }}
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?empty — set the VERCEL_TOKEN secret on the production environment}"
          : "${VERCEL_ORG_ID:?empty — set the VERCEL_ORG_ID Variable on the production environment}"
          # npx (not `npm install -g`) keeps zizmor's ad-hoc-install audit
          # green; the package is cached after the first resolution.
          npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod --token="$VERCEL_TOKEN"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --token="$VERCEL_TOKEN"
