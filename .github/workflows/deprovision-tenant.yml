name: Deprovision Tenant

# Reverses `provision-tenant.yml` for one tenant — removes its custom domain
# from the shared `apps/web` Vercel project, archives its Sanity project so
# it stops billing, clears its persisted Sanity credentials, and archives
# (never hard-deletes) the `tenants` row. The Sanity project is archived
# rather than deleted because
# deleting one needs an org billing permission this token deliberately
# lacks; the project and its dataset survive for a later permanent delete.
#
# Dispatched by hand from the Actions UI by an operator; there is no wizard
# triggering this automatically.
#
# Destructive, so `workflow_dispatch` alone is not enough: `confirm` must
# match the tenant's live name (checked before any deletion) and `dryRun`
# defaults to `true` — an operator must explicitly set it to `false` to
# delete anything. See `packages/db/scripts/deprovision-tenant/run.ts`.
#
# Deliberately manually-triggered only, same posture as
# `refresh-dev-dataset.yml`/`provision-tenant.yml` — it should NOT no-op
# green when a secret is missing: the script fails loudly, before any
# network call, if a required env var is absent.
on:
  workflow_dispatch:
    inputs:
      tenantId:
        description: 'tenants.id of the row to deprovision'
        required: true
        type: string
      confirm:
        description: "Tenant's name, typed to confirm — must match exactly or the run aborts before any destructive step"
        required: true
        type: string
      dryRun:
        description: 'Preview only — logs what would change without changing anything. Set to false to actually deprovision.'
        required: true
        type: boolean
        default: true
      environment:
        description: 'Which Neon branch the tenant registry (the tenants row this run reads/writes) lives in'
        required: true
        type: choice
        options: [development, production]
        default: production

permissions:
  contents: read

# Two dispatches for the SAME tenant must never run concurrently — each
# step's idempotency check reads-then-writes the tenant row, which a
# parallel run for the same tenant could race. Queue behind a running
# deprovision rather than cancel it — a cancelled run could leave an
# external resource half-deleted.
concurrency:
  group: deprovision-tenant-${{ inputs.tenantId }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 11.21.0
  NODE_VERSION: '24'

jobs:
  deprovision:
    name: Deprovision tenant
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Bound to the dispatch input rather than hardcoded: a run dispatched for
    # `development` must resolve every credential (including the tenant
    # registry connection string below) from the `development` GitHub
    # Environment, and a `production` dispatch from `production` — never a
    # mix of the two.
    environment: ${{ inputs.environment }}
    env:
      SANITY_MANAGEMENT_TOKEN: ${{ secrets.SANITY_MANAGEMENT_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      # The *shared* apps/web Vercel project — step 1 removes the tenant's
      # domain from this one project, never a per-tenant project.
      VERCEL_PROJECT_ID_WEB: ${{ vars.VERCEL_PROJECT_ID_WEB }}
      # `getDb()` (via `packages/db/src/utils/env/env.ts`) reads `DATABASE_URL`
      # specifically — deliberately its own secret, distinct from
      # `DATABASE_URL_UNPOOLED` (which `deploy-production.yml`'s `migrate-db`
      # job reads): the tenant registry and the application database are two
      # different connection strings, resolved from the same Environment.
      DATABASE_URL: ${{ secrets.TENANT_REGISTRY_DATABASE_URL }}
      # Step 6 (`invalidate-tenant-cache`) POSTs to the web app's on-demand
      # revalidation endpoint. Both are required only by that final step, so
      # they are absent from `loadDeprovisionEnv`'s `requireEnv` set — the
      # step itself fails loudly when either is missing.
      WEB_APP_URL: ${{ vars.WEB_APP_URL }}
      SITE_CONFIG_REVALIDATE_SECRET: ${{ secrets.SITE_CONFIG_REVALIDATE_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-filter: '@blog/db...'
      - name: Run deprovisioning steps
        # `inputs.*` are attacker-influenceable (any repo collaborator who
        # can trigger workflow_dispatch controls them) — never interpolate a
        # `${{ }}` expression directly into a `run:` shell script (template
        # injection); pass them through `env` and reference the shell
        # variables instead.
        # `GITHUB_ACTOR`/`GITHUB_RUN_ID` need no entry here — Actions sets
        # them as default env vars on every step already, and the script
        # reads them straight from `process.env` to attribute the archive
        # audit event to the dispatching user.
        env:
          TENANT_ID: ${{ inputs.tenantId }}
          CONFIRM: ${{ inputs.confirm }}
          DRY_RUN: ${{ inputs.dryRun }}
        run: pnpm --filter @blog/db db:deprovision-tenant -- --tenant-id="$TENANT_ID" --confirm="$CONFIRM" --dry-run="$DRY_RUN"
