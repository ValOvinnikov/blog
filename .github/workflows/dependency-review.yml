name: Dependency Review

on:
  # No path filter and no base-branch filter, on purpose — same reasoning as
  # ci.yml: a workflow skipped by either leaves any required status check
  # "Pending" forever, whether the PR was skipped for touching only ignored
  # paths or for being based on a branch other than `main`.
  # The action no-ops cheaply on PRs that don't touch the dependency graph.
  pull_request:

permissions:
  contents: read

# A force-push/synchronize supersedes the running suite for the same ref —
# cancel it instead of paying for two full parallel runs.
concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Start conservative to avoid noise: fail the PR only when it
          # introduces a dependency with a known high (or critical) severity
          # advisory. Complements Dependabot, which alerts/updates existing
          # deps but does not gate new ones entering via a PR.
          fail-on-severity: high
