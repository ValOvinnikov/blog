name: Provision Tenant

# Provisions one tenant end to end — Sanity project, seeded starter content,
# Studio deployment, and domain mapping — for a `tenants` row already
# inserted by `apps/admin`'s "Add tenant" wizard Server Action. Dispatched
# via the GitHub API by `apps/admin/src/server/provisioning/dispatch-provisioning-workflow.ts`,
# never by hand from the Actions UI in normal operation (though a human can
# always re-run it manually with the same `tenantId` to retry a failed step
# — every step is independently idempotent, see `packages/db/scripts/provision-tenant/`).
#
# Deliberately manually-triggered only, same posture as `refresh-dev-dataset.yml`
# — it should NOT no-op green when a secret is missing (unlike the
# auto-triggered deploy workflows): `packages/db/scripts/provision-tenant/run.ts`
# fails loudly, before any network call, if a required env var is absent.
on:
  workflow_dispatch:
    inputs:
      tenantId:
        description: 'tenants.id of the row to provision (already inserted by the admin wizard)'
        required: true
        type: string
      adminAppBaseUrl:
        description: 'Override ADMIN_APP_BASE_URL for this run only (e.g. a local tunnel URL) — leave blank to use the production Environment value'
        required: false
        type: string
      tenantSanityDataset:
        description: 'Override TENANT_SANITY_DATASET for this run only — leave blank to use the production Environment value'
        required: false
        type: string
      environment:
        description: 'Which Neon branch the tenant registry (the tenants row this run reads/writes) lives in — independent of tenantSanityDataset, which picks the new tenant''s OWN Sanity dataset'
        required: true
        type: choice
        options: [development, production]
        default: production

permissions:
  contents: read

# Two dispatches for the SAME tenant must never run concurrently — each
# step's idempotency check reads-then-writes the tenant row, which a
# parallel run for the same tenant could race (e.g. two Sanity projects
# minted before either persists). Queue behind a running provision rather
# than cancel it — a cancelled run could leave an external resource
# (Sanity project, Vercel project) created but not yet persisted.
concurrency:
  group: provision-tenant-${{ inputs.tenantId }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 11.21.0
  NODE_VERSION: '22'

jobs:
  provision:
    name: Provision tenant
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Reuses the same `production` GitHub Environment (and required-reviewer
    # gate, if configured) every other prod-affecting job in this repo uses —
    # the Sanity/Vercel credentials this job needs are singleton (one org,
    # one team) regardless of which Neon branch the tenant registry targets,
    # so this isn't a new environment, just the same production credentials
    # store gaining a few more secrets/vars. See docs/DEPLOY.md's "One-time
    # setup" for what's new here. The tenant registry itself (which Neon
    # branch holds the `tenants` row this run reads/writes) is selected
    # per-dispatch by the `environment` input below — see the "Select tenant
    # registry database URL" step.
    environment: production
    env:
      SANITY_MANAGEMENT_TOKEN: ${{ secrets.SANITY_MANAGEMENT_TOKEN }}
      SANITY_ORGANIZATION_ID: ${{ vars.SANITY_ORGANIZATION_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      # The *shared* apps/web Vercel project — step 5 adds every tenant's
      # custom domain to this one project, never a per-tenant project.
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      # Overridable per-dispatch via the adminAppBaseUrl input (e.g. a local
      # tunnel URL) for manual testing — real dispatches from apps/admin's
      # dispatch-provisioning-workflow.ts never set this input, so they
      # always fall back to the production Environment value unaffected.
      ADMIN_APP_BASE_URL: ${{ inputs.adminAppBaseUrl || vars.ADMIN_APP_BASE_URL }}
      PLATFORM_DOMAIN: ${{ vars.PLATFORM_DOMAIN }}
      # Each tenant's own Sanity project gets exactly one dataset, named to
      # match whichever environment provisioned it — externalized here
      # rather than hardcoded in TS. Overridable per-dispatch via the
      # tenantSanityDataset input (e.g. for manual local testing), same
      # fallback pattern as ADMIN_APP_BASE_URL above — the real dispatch
      # from apps/admin never sets this input, so it always falls back to
      # the production Environment value unaffected.
      TENANT_SANITY_DATASET: ${{ inputs.tenantSanityDataset || vars.TENANT_SANITY_DATASET }}
      # Reuses the same variable/secret names `apps/admin`/`apps/web` already
      # use for the same values (not new var names) — see
      # docs/context/environment-variables.md's `WEB_APP_URL`/
      # `SANITY_REVALIDATE_SECRET` rows. Step 6 creates each new tenant's
      # Sanity webhook pointing at `${WEB_APP_URL}/api/revalidate`, signed
      # with this same secret so `apps/web`'s route can verify it.
      WEB_APP_URL: ${{ vars.WEB_APP_URL }}
      SANITY_REVALIDATE_SECRET: ${{ secrets.SANITY_REVALIDATE_SECRET }}
      TENANT_TOKEN_ENCRYPTION_KEY: ${{ secrets.TENANT_TOKEN_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm + node on PATH — also what `vercel build`/`sanity build` (run
      # from inside the provisioning script's Studio-deploy step) need to
      # install the workspace deps.
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      # `getDb()` (via `packages/db/src/utils/env/env.ts`) reads `DATABASE_URL`
      # specifically. Deliberately its OWN secrets, distinct from
      # `DATABASE_URL_UNPOOLED` (which `deploy-production.yml`'s `migrate-db`
      # job reads, from this same `production` GitHub Environment) — the
      # tenant registry and the application database are two different
      # purposes that used to collide on one secret (#2056): repointing this
      # value at the `development` Neon branch to fix a dev-registry lookup
      # silently repointed prod migrations too. Both source secrets live here
      # in `production` because there's still only one credentials store,
      # just two named connection strings in it now. A shell `if`, not the
      # `${{ A && B || C }}` expression idiom used elsewhere in this repo —
      # that idiom returns the FALSE branch whenever B itself is falsy, and a
      # not-yet-configured secret evaluates to `''` (falsy), which would
      # silently fall through to the production connection string instead of
      # failing. `:?` hard-fails on empty-or-unset, not just unset.
      - name: Select tenant registry database URL
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          DEV_URL: ${{ secrets.TENANT_REGISTRY_DATABASE_URL_DEV }}
          PROD_URL: ${{ secrets.TENANT_REGISTRY_DATABASE_URL_PROD }}
        run: |
          set -euo pipefail
          if [ "$TARGET_ENVIRONMENT" = development ]; then
            SELECTED="$DEV_URL"
            SELECTED_NAME=TENANT_REGISTRY_DATABASE_URL_DEV
          else
            SELECTED="$PROD_URL"
            SELECTED_NAME=TENANT_REGISTRY_DATABASE_URL_PROD
          fi
          : "${SELECTED:?empty — set the $SELECTED_NAME secret on the production environment}"
          echo "DATABASE_URL=$SELECTED" >> "$GITHUB_ENV"
      - name: Run provisioning steps
        # `inputs.tenantId` is attacker-influenceable (any repo collaborator
        # who can trigger workflow_dispatch controls it) — never interpolate
        # a `${{ }}` expression directly into a `run:` shell script (template
        # injection); pass it through `env` and reference the shell variable
        # instead.
        env:
          TENANT_ID: ${{ inputs.tenantId }}
        run: pnpm --filter @blog/db db:provision-tenant -- --tenant-id="$TENANT_ID"
