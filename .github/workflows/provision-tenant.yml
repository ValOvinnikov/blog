name: Provision Tenant

# Provisions one tenant end to end — Sanity project, seeded starter
# content, and domain mapping — for a `tenants` row already
# inserted by `apps/platform`'s "Add tenant" wizard Server Action. Dispatched
# via the GitHub API by `apps/platform/src/server/provisioning/dispatch-provisioning-workflow.ts`,
# never by hand from the Actions UI in normal operation (though a human can
# always re-run it manually with the same `tenantId` to retry a failed step
# — every step is independently idempotent, see `packages/db/scripts/provision-tenant/`).
#
# Deliberately manually-triggered only, same posture as `refresh-dev-dataset.yml`
# — it should NOT no-op green when a secret is missing (unlike the
# auto-triggered deploy workflows): `packages/db/scripts/provision-tenant/run.ts`
# fails loudly, before any network call, if a required env var is absent.
on:
  workflow_dispatch:
    inputs:
      tenantId:
        description: 'tenants.id of the row to provision (already inserted by the admin wizard)'
        required: true
        type: string
      adminAppBaseUrl:
        description: "Override ADMIN_APP_BASE_URL for this run only (e.g. a local tunnel URL) — leave blank to use the dispatched environment's value"
        required: false
        type: string
      tenantSanityDataset:
        description: "Override TENANT_SANITY_DATASET for this run only — leave blank to use the dispatched environment's value"
        required: false
        type: string
      environment:
        description: "Which Neon branch the tenant registry (the tenants row this run reads/writes) lives in — independent of tenantSanityDataset, which picks the new tenant's OWN Sanity dataset"
        required: true
        type: choice
        options: [development, production]
        default: production

permissions:
  contents: read

# Two dispatches for the SAME tenant must never run concurrently — each
# step's idempotency check reads-then-writes the tenant row, which a
# parallel run for the same tenant could race (e.g. two Sanity projects
# minted before either persists). Queue behind a running provision rather
# than cancel it — a cancelled run could leave an external resource
# (Sanity project, Vercel project) created but not yet persisted.
concurrency:
  group: provision-tenant-${{ inputs.tenantId }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 11.21.0
  NODE_VERSION: '24'

jobs:
  provision:
    name: Provision tenant
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Bound to the dispatch input rather than hardcoded: a run dispatched for
    # `development` must resolve every credential (including the tenant
    # registry connection string below) from the `development` GitHub
    # Environment, and a `production` dispatch from `production` — never a
    # mix of the two.
    environment: ${{ inputs.environment }}
    env:
      SANITY_MANAGEMENT_TOKEN: ${{ secrets.SANITY_MANAGEMENT_TOKEN }}
      SANITY_ORGANIZATION_ID: ${{ vars.SANITY_ORGANIZATION_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      # The *shared* apps/web Vercel project — step 4 adds every tenant's
      # custom domain to this one project, never a per-tenant project.
      VERCEL_PROJECT_ID_WEB: ${{ vars.VERCEL_PROJECT_ID_WEB }}
      # Overridable per-dispatch via the adminAppBaseUrl input (e.g. a local
      # tunnel URL) for manual testing — real dispatches from apps/platform's
      # dispatch-provisioning-workflow.ts never set this input, so they
      # always fall back to the dispatched environment's value unaffected.
      ADMIN_APP_BASE_URL: ${{ inputs.adminAppBaseUrl || vars.ADMIN_APP_BASE_URL }}
      # Each tenant's own Sanity project gets exactly one dataset, named to
      # match whichever environment provisioned it — externalized here
      # rather than hardcoded in TS. Overridable per-dispatch via the
      # tenantSanityDataset input (e.g. for manual local testing), same
      # fallback pattern as ADMIN_APP_BASE_URL above — the real dispatch
      # from apps/platform never sets this input, so it always falls back to
      # the dispatched environment's value unaffected.
      TENANT_SANITY_DATASET: ${{ inputs.tenantSanityDataset || vars.TENANT_SANITY_DATASET }}
      # Reuses the same variable/secret names `apps/platform`/`apps/web` already
      # use for the same values (not new var names) — see
      # docs/context/environment-variables.md's `WEB_APP_URL`/
      # `SANITY_REVALIDATE_SECRET` rows. Step 5 creates each new tenant's
      # Sanity webhook pointing at `${WEB_APP_URL}/api/revalidate`, signed
      # with this same secret so `apps/web`'s route can verify it.
      WEB_APP_URL: ${{ vars.WEB_APP_URL }}
      SANITY_REVALIDATE_SECRET: ${{ secrets.SANITY_REVALIDATE_SECRET }}
      TENANT_TOKEN_ENCRYPTION_KEY: ${{ secrets.TENANT_TOKEN_ENCRYPTION_KEY }}
      # Shared secret apps/platform's `/api/internal/operator-alert` route
      # verifies as a Bearer token — same value in both places. The
      # operator-alert POST itself targets ADMIN_APP_BASE_URL above; unset
      # means this run still completes and only that notification is skipped.
      OPERATOR_ALERT_SECRET: ${{ secrets.OPERATOR_ALERT_SECRET }}
      # The dispatched environment (`development`/`production`), surfaced on
      # apps/platform's provisioning page as the run's "Registry" — the one
      # of these four run-metadata values Actions doesn't already set as a
      # default env var.
      TENANT_REGISTRY_ENVIRONMENT: ${{ inputs.environment }}
      # `getDb()` (via `packages/db/src/utils/env/env.ts`) reads `DATABASE_URL`
      # specifically — deliberately its own secret, distinct from
      # `DATABASE_URL_UNPOOLED` (which `deploy-production.yml`'s `migrate-db`
      # job reads): the tenant registry and the application database are two
      # different connection strings, resolved from the same Environment.
      DATABASE_URL: ${{ secrets.TENANT_REGISTRY_DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-filter: '@blog/db...'
      - name: Run provisioning steps
        # `inputs.tenantId` is attacker-influenceable (any repo collaborator
        # who can trigger workflow_dispatch controls it) — never interpolate
        # a `${{ }}` expression directly into a `run:` shell script (template
        # injection); pass it through `env` and reference the shell variable
        # instead.
        env:
          TENANT_ID: ${{ inputs.tenantId }}
        run: pnpm --filter @blog/db db:provision-tenant -- --tenant-id="$TENANT_ID"

  # Catches a tenant seeded already-invalid by `starter-content.ts`
  # immediately, rather than waiting for validate-tenant-documents.yml's next
  # scheduled sweep — see that workflow for what this checks and how drift is
  # reported. Only runs once provisioning itself succeeded (the default
  # `needs` gate): a tenant whose Sanity project was never created has
  # nothing to validate yet.
  validate-documents:
    name: Validate freshly provisioned tenant documents
    needs: provision
    uses: ./.github/workflows/validate-tenant-documents.yml
    with:
      tenantId: ${{ inputs.tenantId }}
      environment: ${{ inputs.environment }}
    secrets:
      TENANT_REGISTRY_DATABASE_URL: ${{ secrets.TENANT_REGISTRY_DATABASE_URL }}
      TENANT_TOKEN_ENCRYPTION_KEY: ${{ secrets.TENANT_TOKEN_ENCRYPTION_KEY }}
      OPERATOR_ALERT_SECRET: ${{ secrets.OPERATOR_ALERT_SECRET }}
