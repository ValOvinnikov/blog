name: Storybook Build

# No path filter on purpose — same reasoning as ci.yml / actionlint.yml: a
# path-skipped workflow reports "Pending" forever if it is ever promoted to a
# required check.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: storybook-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.15.0
  NODE_VERSION: '22'
  # Vercel Remote Cache for turbo tasks — shares artifacts with ci.yml's own
  # jobs. No-op until TURBO_TOKEN (repo Secret) and TURBO_TEAM (repo
  # Variable) exist; turbo then falls back to the local cache.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  storybook-build:
    name: Storybook build
    # ADVISORY — deliberately NOT a required status check in the branch
    # ruleset. Stories can rot silently without this job (#1037); it nudges
    # rather than blocks, same posture as Test Presence.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      # Builds both packages/ui's and apps/web's Storybook (`storybook:build`
      # is declared on both workspaces; the root script fans out via turbo,
      # which requires SKIP_ENV_VALIDATION declared in turbo.json's
      # passThroughEnv or it's stripped before reaching the child process —
      # strict env mode, see CLAUDE.md). A broken story fails this job red; it
      # never fetches Sanity content, so SKIP_ENV_VALIDATION matches ci.yml's
      # `build` job's stance for apps/web (its own env validation, via
      # `@t3-oss/env-nextjs`, runs at module import time regardless of
      # whether a story actually needs it).
      - name: Storybook build
        run: pnpm storybook:build
        env:
          SKIP_ENV_VALIDATION: 'true'
