name: Contrast

# Renders every apps/web module story in each brand variant, theme, mode and
# width and fails on a contrast regression against the shrink-only baseline
# (apps/web/contrast/). On demand only — the platform Releases page
# dispatches it on a tag — because a per-PR run would cost more billed minutes
# than the rest of CI together. Never a required check. It checks out the ref
# it was dispatched on and never one named by an input, so its caches stay
# scoped to that ref. The report job posts the outcome, pass or fail, to the
# platform's /api/internal/contrast-result route.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contrast-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.21.0
  NODE_VERSION: '24'
  SHARD_COUNT: 4

jobs:
  storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-filter: web...

      # Saved at the end of this job and restored by every shard: one build,
      # shared through the run-scoped cache key below.
      - name: Share the build with the shards
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/storybook-static
          key: contrast-storybook-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build Storybook
        working-directory: apps/web
        run: pnpm storybook:build

  shard:
    name: Contrast shard (${{ matrix.shard }}/4)
    needs: storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-filter: web...

      - name: Restore the Storybook build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/storybook-static
          key: contrast-storybook-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Install Playwright browser (chromium)
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Contrast suite
        working-directory: apps/web
        env:
          SHARD: ${{ matrix.shard }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/contrast-report.json
        run: pnpm test:contrast --shard="${SHARD}/${SHARD_COUNT}" --workers=4 --reporter=github,dot,json

      - name: Upload the shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contrast-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/contrast-report.json
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Report to the platform
    needs: [storybook, shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: development
    steps:
      # A failed Storybook build leaves no shard reports; the run still posts a FAIL.
      - name: Download the shard reports
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: contrast-report-*
          path: ${{ runner.temp }}/contrast-reports

      - name: Post the result
        env:
          ADMIN_APP_BASE_URL: ${{ vars.ADMIN_APP_BASE_URL }}
          CONTRAST_RESULT_SECRET: ${{ secrets.CONTRAST_RESULT_SECRET }}
          SHARD_RESULT: ${{ needs.shard.result }}
          REPORTS_DIR: ${{ runner.temp }}/contrast-reports
          SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          : "${ADMIN_APP_BASE_URL:?ADMIN_APP_BASE_URL is not set in the development environment}"
          : "${CONTRAST_RESULT_SECRET:?CONTRAST_RESULT_SECRET is not set in the development environment}"

          shopt -s nullglob
          reports=("${REPORTS_DIR}"/*/contrast-report.json)
          failure_count=0
          if (( ${#reports[@]} > 0 )); then
            failure_count=$(jq -s 'map(.stats.unexpected) | add' "${reports[@]}")
          fi
          outcome=FAIL
          if [[ "${SHARD_RESULT}" == success ]]; then outcome=PASS; fi
          tag=""
          if [[ "${REF_TYPE}" == tag ]]; then tag="${REF_NAME}"; fi

          body=$(jq -n \
            --arg sha "${SHA}" \
            --arg outcome "${outcome}" \
            --argjson failureCount "${failure_count}" \
            --arg runUrl "${RUN_URL}" \
            --arg tag "${tag}" \
            '{sha: $sha, outcome: $outcome, failureCount: $failureCount, runUrl: $runUrl}
              + (if $tag == "" then {} else {tag: $tag} end)')
          echo "Posting ${body}"

          curl --fail-with-body --silent --show-error --max-time 30 \
            --request POST "${ADMIN_APP_BASE_URL}/api/internal/contrast-result" \
            --header "Authorization: Bearer ${CONTRAST_RESULT_SECRET}" \
            --header 'Content-Type: application/json' \
            --data "${body}"
