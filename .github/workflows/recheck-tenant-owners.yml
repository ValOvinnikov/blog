name: Recheck Tenant Owners

# Sweeps every fully core-provisioned, active tenant and re-checks whether
# its owner has accepted their Sanity invite, promoting them to
# `administrator` once they have (see `packages/db/scripts/recheck-tenant-owners/`
# and `elevateTenantOwner`). `provision-tenant.yml` only checks once, right
# after provisioning — a human owner routinely accepts well after that
# single check, so this scheduled sweep is the recurring re-check.
#
# Cron runs every 6 hours: ~12 checks within `elevateTenantOwner`'s existing
# 3-day stall threshold (good resolution for detecting a stall promptly),
# while also elevating a genuinely-accepted owner within a few hours rather
# than up to a full day later.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which GitHub Environment this run resolves its credentials from — leave default for the normal scheduled-sweep target'
        required: false
        type: choice
        options: [development, production]
        default: production

permissions:
  contents: read

# One sweep of every tenant at a time — a scheduled run firing while a prior
# one is still running should queue, not overlap (a Sanity role grant racing
# on the same project would be undesirable), same reasoning as
# provision-tenant.yml's per-tenant concurrency guard.
concurrency:
  group: recheck-tenant-owners
  cancel-in-progress: false

env:
  PNPM_VERSION: 11.21.0
  NODE_VERSION: '24'

jobs:
  recheck:
    name: Recheck tenant owners
    runs-on: ubuntu-latest
    # Lighter work per tenant than Provision Tenant (one ACL read plus, at
    # most, one role grant, no Sanity project creation or Vercel work), so this
    # sits at the floor every dependency-installing job gets rather than the
    # larger budget the provisioning jobs need.
    timeout-minutes: 15
    # Bound to the dispatch input rather than hardcoded: a run dispatched for
    # `development` must resolve every credential (including the tenant
    # registry connection string below) from the `development` GitHub
    # Environment, and a `production` dispatch from `production` — never a
    # mix of the two, same as provision-tenant.yml/deprovision-tenant.yml.
    #
    # The `|| 'production'` fallback is load-bearing, and is why this line
    # cannot be spelled exactly like those two: they are `workflow_dispatch`
    # only, whereas a `schedule`-triggered run here has a null `inputs`
    # context. A bare `inputs.environment` would resolve to an empty
    # environment name on every cron run, leaving the sweep with none of the
    # secrets below.
    #
    # A cron run also has no human present to satisfy a required-reviewer
    # rule — if one is ever added to either Environment, this workflow would
    # silently stall forever rather than run unattended. Give this job its
    # own environment first if that protection is ever configured.
    environment: ${{ inputs.environment || 'production' }}
    env:
      SANITY_MANAGEMENT_TOKEN: ${{ secrets.SANITY_MANAGEMENT_TOKEN }}
      # The deployed `apps/platform` origin (no trailing slash/path) this
      # sweep POSTs an operator-alert event to on a notifiable
      # owner-elevation outcome. Unset means the sweep still runs; only the
      # operator notification is skipped.
      ADMIN_APP_BASE_URL: ${{ vars.ADMIN_APP_BASE_URL }}
      # Shared secret `apps/platform`'s `/api/internal/operator-alert` route
      # verifies as a Bearer token — same value in both places.
      OPERATOR_ALERT_SECRET: ${{ secrets.OPERATOR_ALERT_SECRET }}
      # `getDb()` (via `packages/db/src/utils/env/env.ts`) reads `DATABASE_URL`
      # specifically — deliberately its own secret, distinct from
      # `DATABASE_URL_UNPOOLED` (which `deploy-production.yml`'s `migrate-db`
      # job reads): the tenant registry and the application database are two
      # different connection strings, resolved from the same Environment.
      # Empty or unset fails the sweep loudly in `createEnv`, so the shell
      # `:?` guard the removed selector step carried is not needed here.
      DATABASE_URL: ${{ secrets.TENANT_REGISTRY_DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-filter: '@blog/db...'
      - name: Run owner-elevation sweep
        run: pnpm --filter @blog/db db:recheck-tenant-owners
