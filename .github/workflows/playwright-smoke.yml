name: Playwright Smoke

# Dispatch-only: there is no per-PR preview deploy to smoke, and every step is
# skipped until the repo Variable SMOKE_URL names a live origin.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PNPM_VERSION: 11.21.0
      NODE_VERSION: '24'
      SMOKE_URL: ${{ vars.SMOKE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright browser (chromium)
        if: ${{ env.SMOKE_URL != '' }}
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright smoke suite
        if: ${{ env.SMOKE_URL != '' }}
        working-directory: apps/web
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ env.SMOKE_URL != '' && failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
